<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Racer - Princess & Ultimate Boss Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020205;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
        }
        canvas { display: block; }
        
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            z-index: 50;
        }
        .score-box {
            background: rgba(5, 5, 20, 0.8);
            border: 1px solid rgba(0, 242, 255, 0.5);
            padding: 10px 25px;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(10, 10, 30, 0.9) 0%, rgba(2, 2, 5, 1) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        .neon-title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 20px #00f2ff, 0 0 40px #7000ff;
            margin-bottom: 2rem;
        }

        .selection-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            max-width: 950px;
            justify-content: center;
            align-items: center;
        }

        .preview-circle {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-start {
            background: rgba(255, 0, 222, 0.1);
            border: 2px solid #ff00de;
            color: #ff00de;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            margin-top: 2rem;
        }
        .btn-start:hover {
            background: #ff00de;
            color: white;
            box-shadow: 0 0 30px #ff00de;
            transform: scale(1.05);
        }

        .color-dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .color-dot.active { border-color: white; transform: scale(1.3); }

        .model-btn {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .model-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .model-btn.active { border-color: white; background: rgba(255, 255, 255, 0.2); }

        /* חלון התראה של הבוס */
        #boss-alert {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0033;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            text-shadow: 0 0 20px #ff0033, 0 0 40px #ff0033;
            display: none;
            z-index: 60;
            text-align: center;
            pointer-events: none;
            animation: warningPulse 0.4s infinite alternate;
        }

        @keyframes warningPulse {
            from { transform: translate(-50%, -50%) scale(0.95); opacity: 0.6; }
            to { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Back to Home Button -->
    <a id="back-to-home-btn" href="https://tair-pnini.github.io/play-ai" class="absolute top-4 left-4 z-[200] bg-slate-800 text-white px-4 py-2 rounded border-b-4 border-black font-bold active:translate-y-1 hover:bg-slate-700 transition-all text-sm tracking-widest no-underline flex items-center gap-2" style="font-family: Arial, sans-serif;">
        <span dir="ltr">&#8592;</span> משחקים של תלמידים נוספים
    </a>

    <div class="hud">
        <div class="score-box">
            <div class="text-[10px] opacity-60">ציון</div>
            <div id="scoreVal" class="text-2xl font-bold">000000</div>
        </div>
        <div class="score-box" style="border-color: #ff00de;">
            <div class="text-[10px] opacity-60">שיא</div>
            <div id="highScoreVal" class="text-2xl font-bold" style="color: #ff00de;">000000</div>
        </div>
    </div>

    <!-- כותרת אזהרה לבוס -->
    <div id="boss-alert">
        אזהרת בוס חמורה!<br>
        <span id="boss-lvl-text" class="text-2xl text-white">רמת איום: 1</span>
    </div>

    <div id="overlay">
        <h1 class="neon-title" id="mainTitle">Neon Racer</h1>
        
        <div class="selection-panel">
            <div class="preview-circle">
                <canvas id="previewCanvas" width="180" height="180"></canvas>
            </div>
            
            <div class="flex flex-col gap-6">
                <div class="grid grid-cols-3 gap-2">
                    <button class="model-btn active" id="btn-apex" onclick="setModel('apex')">APEX</button>
                    <button class="model-btn" id="btn-raptor" onclick="setModel('raptor')">RAPTOR</button>
                    <button class="model-btn" id="btn-neutron" onclick="setModel('neutron')">NEUTRON</button>
                    <button class="model-btn" id="btn-valkyrie" onclick="setModel('valkyrie')">VALKYRIE</button>
                    <button class="model-btn" id="btn-jufacn" onclick="setModel('jufacn')">JUFACN ✨</button>
                    <button class="model-btn" id="btn-phoenix" onclick="setModel('phoenix')">PHOENIX</button>
                </div>
                
                <div class="grid grid-cols-6 gap-3">
                    <div class="color-dot active" style="background:#00f2ff" onclick="setColor('#00f2ff', this)"></div>
                    <div class="color-dot" style="background:#ff00de" onclick="setColor('#ff00de', this)"></div>
                    <div class="color-dot" style="background:#39ff14" onclick="setColor('#39ff14', this)"></div>
                    <div class="color-dot" style="background:#ffae00" onclick="setColor('#ffae00', this)"></div>
                    <div class="color-dot" style="background:#bc13fe" onclick="setColor('#bc13fe', this)"></div>
                    <div class="color-dot" style="background:#fdfd07" onclick="setColor('#fdfd07', this)"></div>
                    <div class="color-dot" style="background:#ff3131" onclick="setColor('#ff3131', this)"></div>
                    <div class="color-dot" style="background:#00d9ff" onclick="setColor('#00d9ff', this)"></div>
                    <div class="color-dot" style="background:#ff007c" onclick="setColor('#ff007c', this)"></div>
                    <div class="color-dot" style="background:#adff2f" onclick="setColor('#adff2f', this)"></div>
                    <div class="color-dot" style="background:#ffffff" onclick="setColor('#ffffff', this)"></div>
                    <div class="color-dot" style="background:#ffa07a" onclick="setColor('#ffa07a', this)"></div>
                </div>
            </div>
        </div>

        <button class="btn-start" onclick="startGame()">התחל משימה</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pCanvas = document.getElementById('previewCanvas');
        const pCtx = pCanvas.getContext('2d');

        let gameActive = false;
        let score = 0;
        let highScore = localStorage.getItem('neonHighScore') || 0;
        
        let worldSpeed = 1.6; // מהירות התחלתית משופרת וזורמת יותר (עלתה מ-1.2 ל-1.6)
        let shipHorizontalSpeed = 5.3; // מהירות חללית התחלתית מותאמת למהירות המסלול החדשה

        let shipColor = '#00f2ff';
        let shipModel = 'apex';
        let player = { x: 0, y: 0, targetX: 0, velocity: 0 };
        
        let stars = [];
        let obstacles = [];
        let frameCount = 0;
        let lastTime = 0; // לחישוב Delta Time
        let obstacleSpawnTimer = 0; // טיימר דינמי לייצור מכשולים

        // הגדרות בוס
        let bossActive = false;
        let bossLevel = 0;
        let lastBossMilestone = 0;
        let boss = {
            x: 0,
            y: -150,
            width: 140,
            height: 60,
            color: '#ff003c',
            shape: 'triangle',
            timer: 0, 
            attackCooldown: 0,
            lasers: []
        };

        const bossShapes = ['triangle', 'diamond', 'crawler', 'fortress'];
        const bossColors = ['#ff003c', '#d200ff', '#ff6a00', '#ff007c', '#00ffc4'];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.targetX = player.x;
            player.y = canvas.height - 150;
            
            document.getElementById('highScoreVal').innerText = highScore.toString().padStart(6, '0');
            
            stars = Array.from({length: 120}, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 3 + 1
            }));
            
            drawPreview();
        }

        function setModel(m) { 
            shipModel = m; 
            document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${m}`).classList.add('active');
            drawPreview(); 
        }

        function setColor(c, el) { 
            shipColor = c; 
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            drawPreview(); 
        }

        // פונקציית ציור חללית ללא שימוש ב-shadowBlur האיטי של הדפדפן
        function drawShipGeometry(c) {
            if (shipModel === 'apex') {
                c.beginPath(); c.moveTo(0, -20); c.lineTo(-15, 15); c.lineTo(15, 15); c.closePath(); c.fill(); c.stroke();
            } else if (shipModel === 'raptor') {
                c.fillRect(-5, -25, 10, 40);
                c.beginPath(); c.moveTo(-5, 0); c.lineTo(-25, 20); c.lineTo(-5, 20); c.fill(); c.stroke();
                c.beginPath(); c.moveTo(5, 0); c.lineTo(25, 20); c.lineTo(5, 20); c.fill(); c.stroke();
            } else if (shipModel === 'neutron') {
                c.beginPath(); c.arc(0, 0, 10, 0, Math.PI*2); c.fill();
                c.beginPath(); c.moveTo(-20, 5); c.lineTo(20, 5); c.lineTo(0, -30); c.closePath(); c.stroke();
            } else if (shipModel === 'valkyrie') {
                c.beginPath(); c.moveTo(0, -30); c.lineTo(-20, 20); c.lineTo(0, 5); c.lineTo(20, 20); c.closePath(); c.fill(); c.stroke();
            } else if (shipModel === 'jufacn') {
                // Jufacn - Princess with HAIR
                c.save();
                c.fillStyle = shipColor;
                c.beginPath();
                c.moveTo(-12, -25);
                c.bezierCurveTo(-25, -20, -20, 10, -18, 25);
                c.lineTo(18, 25);
                c.bezierCurveTo(20, 10, 25, -20, 12, -25);
                c.closePath();
                c.fill();
                
                c.fillStyle = "white";
                c.beginPath(); c.arc(0, -20, 8, 0, Math.PI*2); c.fill();
                
                c.fillStyle = shipColor;
                c.beginPath();
                c.arc(0, -23, 9, Math.PI, 0);
                c.fill();

                c.fillStyle = "black";
                c.fillRect(-3, -22, 2, 2); c.fillRect(1, -22, 2, 2);
                
                c.fillStyle = "white";
                c.beginPath(); c.moveTo(0, -12); c.lineTo(-15, 15); c.lineTo(15, 15); c.closePath(); c.fill();
                c.strokeStyle = shipColor;
                c.stroke();
                
                c.beginPath(); c.moveTo(-5, 15); c.lineTo(-5, 25); c.moveTo(5, 15); c.lineTo(5, 25); c.stroke();
                c.restore();
            } else if (shipModel === 'phoenix') {
                c.beginPath(); c.moveTo(0, -25); c.quadraticCurveTo(20, 0, 0, 25); c.quadraticCurveTo(-20, 0, 0, -25); c.fill(); c.stroke();
                c.beginPath(); c.moveTo(-10, 0); c.lineTo(-30, -10); c.lineTo(-30, 10); c.closePath(); c.stroke();
                c.beginPath(); c.moveTo(10, 0); c.lineTo(30, -10); c.lineTo(30, 10); c.closePath(); c.stroke();
            }
        }

        function drawShip(c, x, y, size = 1) {
            c.save();
            c.translate(x, y);
            c.scale(size, size);
            
            // סימולציית ניאון מהירה על ידי שכבות חצי שקופות במקום shadowBlur
            c.strokeStyle = shipColor;
            c.lineWidth = 6;
            c.globalAlpha = 0.25;
            drawShipGeometry(c);
            
            c.lineWidth = 4;
            c.globalAlpha = 0.5;
            drawShipGeometry(c);

            c.lineWidth = 2;
            c.globalAlpha = 1.0;
            c.fillStyle = "white";
            drawShipGeometry(c);
            
            // להבת מנוע מונפשת
            c.fillStyle = Math.random() > 0.5 ? "white" : shipColor;
            c.beginPath(); c.moveTo(-5, 15); c.lineTo(0, 15 + Math.random()*20); c.lineTo(5, 15); c.fill();
            
            c.restore();
        }

        function drawPreview() {
            pCtx.clearRect(0,0,180,180);
            drawShip(pCtx, 90, 90, 1.8);
            if(!gameActive) requestAnimationFrame(drawPreview);
        }

        // שליטה - גרירה או חצים בלבד
        let isDragging = false;
        window.addEventListener('mousedown', (e) => { if(gameActive) { isDragging = true; player.targetX = e.clientX; } });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => { if(isDragging && gameActive) player.targetX = e.clientX; });
        
        window.addEventListener('touchstart', (e) => { if(gameActive) { isDragging = true; player.targetX = e.touches[0].clientX; e.preventDefault(); } }, {passive: false});
        window.addEventListener('touchmove', (e) => { if(isDragging && gameActive) { player.targetX = e.touches[0].clientX; e.preventDefault(); } }, {passive: false});
        window.addEventListener('touchend', () => isDragging = false);

        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') player.velocity = -shipHorizontalSpeed;
            if(e.key === 'ArrowRight') player.velocity = shipHorizontalSpeed;
        });
        window.addEventListener('keyup', () => player.velocity = 0);

        function startGame() {
            gameActive = true;
            score = 0;
            worldSpeed = 1.6; // מהירות התחלתית משופרת, מאוזנת וזורמת
            shipHorizontalSpeed = 5.3;
            obstacles = [];
            bossActive = false;
            lastBossMilestone = 0;
            boss.lasers = [];
            obstacleSpawnTimer = 0;
            lastTime = performance.now(); 
            
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('back-to-home-btn').style.display = 'none'; // הסתרת הכפתור
            
            requestAnimationFrame(loop);
        }

        function spawnObstacle() {
            if (bossActive) return;

            const type = Math.random() > 0.45 ? 'gate' : 'laser';
            if(type === 'gate') {
                const currentGateWidth = Math.max(130, 260 - (score / 150));
                const x = Math.random() * (canvas.width - currentGateWidth);
                obstacles.push({type, x, y: -50, w: currentGateWidth, h: 30});
            } else {
                const w = canvas.width * 0.28;
                const x = Math.random() > 0.5 ? 0 : canvas.width - w;
                obstacles.push({type, x, y: -50, w, h: 20});
            }
        }

        // איתחול והתחלת קרב בוס
        function triggerBossFight(lvl) {
            bossActive = true;
            bossLevel = lvl;
            boss.x = canvas.width / 2;
            boss.y = -180;
            boss.timer = 1000 + (lvl * 150); 
            boss.attackCooldown = 60; 
            boss.lasers = [];
            
            boss.color = bossColors[(lvl - 1) % bossColors.length];
            boss.shape = bossShapes[(lvl - 1) % bossShapes.length];

            const alertBox = document.getElementById('boss-alert');
            const alertText = document.getElementById('boss-lvl-text');
            alertText.innerText = `רמת איום: ${lvl} | דגם: ${boss.shape.toUpperCase()}`;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);
        }

        function updateBoss(dt) {
            if (!bossActive) return;

            if (boss.y < 120) {
                boss.y += 2 * dt;
            } else {
                const trackSpeed = (0.018 + Math.min(0.09, bossLevel * 0.015)) * dt;
                boss.x += (player.x - boss.x) * trackSpeed;
            }

            boss.attackCooldown -= dt;
            if (boss.attackCooldown <= 0 && boss.y >= 120) {
                let laserCount = 1;
                if (bossLevel >= 3 && bossLevel <= 4) laserCount = 2;
                else if (bossLevel >= 5) laserCount = 3;

                const offsetRange = laserCount === 2 ? 100 : 130;

                for (let i = 0; i < laserCount; i++) {
                    let offset = 0;
                    if (laserCount === 2) {
                        offset = i === 0 ? -offsetRange : offsetRange;
                    } else if (laserCount === 3) {
                        offset = (i - 1) * offsetRange;
                    }

                    const baseWarningTime = 100;
                    const minWarningTime = 30; 
                    const warningTime = Math.max(minWarningTime, baseWarningTime - (bossLevel * 10));

                    boss.lasers.push({
                        x: boss.x + offset,
                        y: boss.y + 40,
                        w: 22 + Math.min(25, bossLevel * 3), 
                        h: canvas.height,
                        timer: warningTime, 
                        active: false,
                        duration: 40 
                    });
                }
                
                boss.attackCooldown = Math.max(50, 150 - (bossLevel * 15));
            }

            for (let i = boss.lasers.length - 1; i >= 0; i--) {
                let l = boss.lasers[i];
                if (!l.active) {
                    l.timer -= dt;
                    if (l.timer <= 0) l.active = true;
                } else {
                    l.duration -= dt;
                    if (Math.abs(player.x - l.x) < (l.w / 2) + 12 && player.y > l.y) {
                        gameOver();
                    }
                    if (l.duration <= 0) {
                        boss.lasers.splice(i, 1);
                    }
                }
            }

            boss.timer -= dt;
            if (boss.timer <= 0) {
                boss.y -= 5 * dt;
                if (boss.y < -180) {
                    bossActive = false;
                    boss.lasers = [];
                }
            }
        }

        function update(dt) {
            frameCount++;
            
            score += Math.round(2 * dt); 
            document.getElementById('scoreVal').innerText = score.toString().padStart(6, '0');
            
            if(score > highScore) {
                highScore = score;
                document.getElementById('highScoreVal').innerText = highScore.toString().padStart(6, '0');
                localStorage.setItem('neonHighScore', highScore);
            }

            let currentMilestone = Math.floor(score / 5000);
            if (currentMilestone > lastBossMilestone && currentMilestone > 0 && !bossActive) {
                lastBossMilestone = currentMilestone;
                triggerBossFight(currentMilestone);
            }

            if(isDragging) {
                player.x += (player.targetX - player.x) * 0.15 * dt;
            } else {
                player.x += player.velocity * dt;
            }
            
            player.x = Math.max(30, Math.min(canvas.width - 30, player.x));

            stars.forEach(s => {
                s.y += s.speed * (worldSpeed/2) * dt;
                if(s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
            });

            if (bossActive) {
                updateBoss(dt);
            } else {
                const currentSpawnInterval = Math.max(55, 160 - (score / 120));
                
                obstacleSpawnTimer += dt;
                if (obstacleSpawnTimer >= currentSpawnInterval) {
                    spawnObstacle();
                    obstacleSpawnTimer = 0;
                }
            }

            for(let i = obstacles.length-1; i >= 0; i--) {
                let o = obstacles[i];
                o.y += worldSpeed * dt;
                
                if(o.y + o.h > player.y - 15 && o.y < player.y + 15) {
                    if(o.type === 'gate') {
                        if(player.x < o.x || player.x > o.x + o.w) gameOver();
                    } else {
                        if(player.x > o.x && player.x < o.x + o.w) gameOver();
                    }
                }
                if(o.y > canvas.height) obstacles.splice(i, 1);
            }

            // האצת מהירות העולם בצורה הדרגתית, רציפה וחלקה על בסיס הניקוד האמיתי שלך
            worldSpeed = 1.6 + (score / 2800);

            // עדכון דינמי של מהירות תנועת החללית הצידית ביחס למהירות העולם
            shipHorizontalSpeed = 4.5 + (worldSpeed * 1.6);
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('mainTitle').innerText = "המשימה נכשלה";
            document.getElementById('mainTitle').style.color = "#ff0033";
            document.getElementById('back-to-home-btn').style.display = 'flex'; // החזרת הכפתור
            drawPreview();
        }

        function drawBossGeometry(c) {
            if (boss.shape === 'triangle') {
                c.beginPath(); c.moveTo(0, -40); c.lineTo(-70, 30); c.lineTo(70, 30); c.closePath(); c.fill(); c.stroke();
            } else if (boss.shape === 'diamond') {
                c.beginPath(); c.moveTo(0, -50); c.lineTo(60, 0); c.lineTo(0, 50); c.lineTo(-60, 0); c.closePath(); c.fill(); c.stroke();
            } else if (boss.shape === 'crawler') {
                c.fillRect(-60, -20, 120, 40); c.strokeRect(-60, -20, 120, 40);
                c.beginPath(); c.moveTo(-60, 0); c.lineTo(-80, 20); c.moveTo(60, 0); c.lineTo(80, 20); c.stroke();
            } else { 
                c.beginPath(); c.moveTo(-70, -30); c.lineTo(70, -30); c.lineTo(90, 30); c.lineTo(-90, 30); c.closePath(); c.fill(); c.stroke();
            }
        }

        function drawBoss(c) {
            if (!bossActive) return;

            c.save();
            c.translate(boss.x, boss.y);
            c.strokeStyle = boss.color;
            c.fillStyle = "#10101d";

            c.lineWidth = 10;
            c.globalAlpha = 0.2;
            drawBossGeometry(c);

            c.lineWidth = 6;
            c.globalAlpha = 0.4;
            drawBossGeometry(c);

            c.lineWidth = 3;
            c.globalAlpha = 1.0;
            drawBossGeometry(c);

            c.fillStyle = "white";
            c.beginPath();
            c.arc(0, 0, 10 + Math.sin(frameCount * 0.1) * 3, 0, Math.PI * 2);
            c.fill();

            c.restore();

            boss.lasers.forEach(l => {
                if (l.active) {
                    c.save();
                    c.fillStyle = boss.color;
                    c.globalAlpha = 0.2;
                    c.fillRect(l.x - (l.w / 2) - 12, l.y, l.w + 24, l.h);
                    
                    c.globalAlpha = 0.4;
                    c.fillRect(l.x - (l.w / 2) - 6, l.y, l.w + 12, l.h);

                    c.globalAlpha = 1.0;
                    c.fillRect(l.x - (l.w / 2), l.y, l.w, l.h);
                    c.fillStyle = "white";
                    c.fillRect(l.x - 4, l.y, 8, l.h);
                    c.restore();
                } else {
                    c.save();
                    c.strokeStyle = boss.color;
                    c.lineWidth = 2.5;
                    c.setLineDash([12, 12]);
                    
                    const blinkSpeed = 0.15 + (bossLevel * 0.05);
                    c.globalAlpha = Math.sin(frameCount * blinkSpeed) * 0.4 + 0.6;
                    
                    c.beginPath();
                    c.moveTo(l.x, l.y);
                    c.lineTo(l.x, l.h);
                    c.stroke();
                    c.restore();
                }
            });
        }

        function draw() {
            ctx.fillStyle = '#020205';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            
            ctx.strokeStyle = "rgba(0, 242, 255, 0.05)";
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=100) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            ctx.fillStyle = "white";
            stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

            obstacles.forEach(o => {
                if(o.type === 'gate') {
                    ctx.fillStyle = "rgba(255, 0, 222, 0.15)";
                    ctx.fillRect(0, o.y - 4, o.x + 4, o.h + 8);
                    ctx.fillRect(o.x + o.w - 4, o.y - 4, canvas.width - (o.x + o.w) + 4, o.h + 8);

                    ctx.fillStyle = "#ff00de";
                    ctx.fillRect(0, o.y, o.x, o.h);
                    ctx.fillRect(o.x + o.w, o.y, canvas.width, o.h);
                } else {
                    ctx.fillStyle = "rgba(0, 242, 255, 0.15)";
                    ctx.fillRect(o.x - 4, o.y - 4, o.w + 8, o.h + 8);

                    ctx.fillStyle = "#00f2ff";
                    ctx.fillRect(o.x, o.y, o.w, o.h);
                }
            });

            drawBoss(ctx);

            drawShip(ctx, player.x, player.y);
        }

        function loop(timestamp) {
            if(!gameActive) return;
            
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 16.666; 
            if (dt > 4) dt = 4; 
            lastTime = timestamp;

            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        window.onload = init;
        window.onresize = init;
    </script>
</body>
</html>
