<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ========================================== -->
    <!--  אזור עדכון - כל מה שצריך לשנות נמצא כאן  -->
    <!-- ========================================== -->
    
    <!-- 1. כותרת ותיאור לתצוגה המקדימה -->
    <title>משחקי קופסה שתאיר אוהבת במיוחד 🎲</title>
    <meta property="og:title" content="משחקי קופסה שתאיר אוהבת במיוחד 🎲">
    <meta property="og:description" content="המלצות על משחקים שבאמת 'עושים שכל', הסברים פשוטים בלי חפירות ולפעמים גם מבצעים שווים. הצטרפו לקבוצה שקטה לחובבות וחובבי משחקים.">
    
    <!-- 2. תמונת התצוגה המקדימה -->
    <meta property="og:image" content="https://cdn.apartmenttherapy.info/image/upload/v1667575155/stock/custom%20stock/2022-11-custom-stock/games-0228-edit.jpg">
    
    <!-- 3. הקישור לקבוצת הוואטסאפ (חובה לעדכן בשני המקומות למטה עבור התצוגה המקדימה) -->
    <meta property="og:url" content="https://chat.whatsapp.com/HEUYyb8C8cu5Gr5R40uxd">
    <meta http-equiv="refresh" content="2; url=https://chat.whatsapp.com/HEUYyb8C8cu5Gr5R40uxd">

    <script>
        // זהו המשתנה הראשי - הוא משפיע על ההפניה האוטומטית ועל הכפתור בדף
        const whatsappUrl = "https://chat.whatsapp.com/HEUYyb8C8cu5Gr5R40uxd";
        
        // הפניה מיידית
        window.location.replace(whatsappUrl);
    </script>
    
    <!-- ========================================== -->

    <meta property="og:type" content="website">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        .bg-pattern {
            background-color: #f3f4f6;
            background-image: radial-gradient(#25d366 0.5px, transparent 0.5px), radial-gradient(#25d366 0.5px, #f3f4f6 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            opacity: 0.1;
            position: absolute;
            inset: 0;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 overflow-hidden relative">
    <div class="bg-pattern"></div>

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 text-center border border-gray-100 z-10 transition-all hover:shadow-2xl">
        <!-- אייקון וואטסאפ -->
        <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-green-200">
            <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.72.94 3.659 1.437 5.63 1.438h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-4 leading-tight">
            משחקי קופסה שתאיר אוהבת במיוחד
        </h1>
        
        <p class="text-lg text-gray-600 mb-10 font-medium italic">
            הצטרפות לקבוצת הווטסאפ
        </p>

        <!-- הכפתור הידני - מושך אוטומטית את הקישור מה-JavaScript -->
        <a id="joinButton" href="#" 
           class="inline-block w-full py-4 px-6 bg-green-500 hover:bg-green-600 text-white font-bold rounded-2xl transition-all shadow-lg shadow-green-100 transform active:scale-95">
            הצטרפות לקבוצה
        </a>

        <div class="mt-12 flex justify-center">
            <div class="flex space-x-2 space-x-reverse opacity-40">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-2 h-2 bg-green-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                <div class="w-2 h-2 bg-green-500 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
            </div>
        </div>
    </div>

    <script>
        // עדכון הקישור בכפתור באופן אוטומטי מהמשתנה whatsappUrl שמוגדר למעלה
        document.getElementById('joinButton').href = whatsappUrl;

        // ניסיון הפניה נוסף בסיום טעינת הדף
        window.onload = function() {
            window.location.replace(whatsappUrl);
        };
    </script>
</body>
</html>
