<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>אות-אות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #26323f;
    --muted: #66717d;
    --line: #c9ced4;
    --paper: #fbfaf6;
    --card: #ffffff;
    --soft: #e9edf0;
    --accent: #0f6e6e;
    --red: #c2362f;
    --cell: min(46px, calc((100vw - 24px) / var(--cols, 10)));
  }
  * { box-sizing: border-box; }
  html { font-size: 110%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Assistant', sans-serif;
    line-height: 1.45;
  }
  main { max-width: 560px; margin: 0 auto; padding: 18px 12px 28px; }
  h1 { font-size: 2rem; font-weight: 800; margin: 0; }
  .how { color: var(--muted); margin: 2px 0 14px; }

  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .bar .time { font-weight: 700; font-variant-numeric: tabular-nums; margin-inline-end: auto; direction: ltr; }
  button { font: inherit; color: inherit; }
  .btn {
    min-height: 44px; padding: 6px 16px; font-weight: 600;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; }

  #board { width: fit-content; margin: 0 auto; }
  .tops, .grid { display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); }
  .stack { display: flex; flex-direction: column; justify-content: flex-end; }
  .stack.on { background: var(--soft); border-radius: 6px 6px 0 0; }
  .tile {
    width: var(--cell); height: min(36px, var(--cell));
    padding: 0; background: none; border: 0; cursor: pointer;
    font-size: calc(var(--cell) * .58); font-weight: 600; line-height: 1;
  }
  .waiting .tile { visibility: hidden; }
  .drop .tile { animation: fall .45s both; animation-delay: var(--d); }
  @keyframes fall { from { transform: translateY(-46px); opacity: 0; } }

  .grid { border-top: 1px solid var(--ink); border-right: 1px solid var(--ink); }
  .cell {
    position: relative; width: var(--cell); height: var(--cell); padding: 0;
    background: var(--card); border: 0; border-left: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
    font-size: calc(var(--cell) * .62); font-weight: 700; line-height: 1; cursor: pointer;
  }
  .cell.black { background: var(--ink); cursor: default; }
  .cell.column { background: var(--soft); }
  .cell.on { background: #bfdedb; }
  .cell.ring::before {
    content: ""; position: absolute; inset: 9%;
    border: 1.5px solid var(--muted); border-radius: 50%;
  }
  .nope { animation: nope .5s; }
  @keyframes nope { 30% { background: var(--red); color: #fff; } }

  .source { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 14px 0 4px; }
  .source span.label { color: var(--muted); margin-inline-end: 6px; }
  .src {
    width: 34px; height: 34px; display: grid; place-items: center;
    border: 1.5px solid var(--muted); border-radius: 50%; font-weight: 700;
  }
  .src.given { background: var(--soft); }
  .msg { min-height: 1.5em; text-align: center; font-weight: 600; margin: 8px 0; }

  .phone-del { display: flex; justify-content: center; gap: 8px; }

  dialog {
    width: min(420px, calc(100vw - 32px)); padding: 22px;
    border: 0; border-radius: 12px; color: var(--ink); text-align: center;
  }
  dialog::backdrop { background: rgba(38, 50, 63, .45); }
  dialog h2 { margin: 0 0 8px; font-size: 1.6rem; }
  dialog blockquote { margin: 0 0 4px; font-size: 1.25rem; font-weight: 700; }
  dialog .who { color: var(--muted); margin: 0 0 12px; }
  dialog .stats { margin: 0 0 16px; }
  dialog .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; }

  footer {
    max-width: 560px; margin: 0 auto; padding: 14px 12px 26px;
    border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; text-align: center;
  }
  footer strong { color: var(--ink); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>אות-אות</h1>
  <p class="how">מעל כל עמודה נמצאות האותיות שלה, בסדר מעורב. בוחרים משבצת ולוחצים על אות מהעמודה. המשפט נקרא מימין לשמאל, ומשבצת שחורה היא רווח.</p>

  <div class="bar">
    <span class="time" id="time">00:00</span>
    <button class="btn" id="check" disabled>בדיקה</button>
    <button class="btn main" id="start">התחלה</button>
  </div>

  <div id="board" class="waiting">
    <div class="tops" id="tops"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="source" id="source"></div>
  <p class="msg" id="msg" role="status"></p>
  <div class="phone-del"><button class="btn" id="erase" disabled>מחיקה</button></div>
</main>

<footer>
  <strong>תאיר פניני | מרחב למחשבה</strong><br>
  הפורמט בהשראת <a href="https://gisnep.com" rel="noopener">gisnep.com</a> ·
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.he" rel="noopener">CC BY-NC-SA</a>: שימוש חינוכי חופשי, בלי שימוש מסחרי
</footer>

<dialog id="done">
  <h2>כל הכבוד!</h2>
  <blockquote id="doneQuote"></blockquote>
  <p class="who" id="doneWho"></p>
  <p class="stats" id="doneStats"></p>
  <div class="acts">
    <a class="btn main" id="share" target="_blank" rel="noopener">שיתוף בוואטסאפ</a>
    <button class="btn" id="closeDone">סגירה</button>
  </div>
</dialog>

<script src="engine.js"></script>
</body>
</html>
