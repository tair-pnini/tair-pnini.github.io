<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <!-- התצוגה המקדימה בוואטסאפ וכו' (התמונה נוצרת מ-_local/og-graphs.html) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="גרפים? בקטנה. תרגול לבוחן">
  <meta property="og:description" content="כל השאלות מהמקבץ, עם בדיקה מיידית ורמזים כשנתקעים. כמה דקות של תרגול, והבוחן אצלכם בכיס 💪">
  <meta property="og:image" content="https://tair-pnini.github.io/math/y10/graphs/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>גרפים: תרגול</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&amp;family=Heebo:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Shared site bars (<site-header>, <site-footer>) -->
  <script src="/assets/site.js"></script>
  <script src="data.js"></script>
  <script src="check.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* אותה פלטה כמו בדף הגדילה והדעיכה */
    :root {
      --c-qty: #38bdf8;
      --c-time: #fbbf24;
      --c-rate: #4ade80;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-subtle: rgba(255, 255, 255, 0.12);
    }

    body {
      background: var(--bg-dark);
      color: #f1f5f9;
      font-family: 'Assistant', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
    }

    site-header, site-footer { align-self: stretch; margin: 0 -16px; }
    site-footer { background: #ffffff; }

    .wrap { width: 100%; max-width: 1100px; padding: 20px 0 40px; }
    .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      line-height: 1.15;
      margin: 0 4px;
    }
    .frac > span { padding: 0 5px; }
    .frac > span + span { border-top: 2px solid currentColor; }

    /* ---------- ניווט בין השאלות ---------- */
    .back { color: #94a3b8; font-size: 17px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .back:hover { color: #ffffff; }
    .qnav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .qnav .title { font-family: 'Heebo', sans-serif; font-size: 20px; font-weight: 700; margin-left: 10px; }
    .qnav button {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.18);
      color: #cbd5e1;
      border-radius: 10px;
      padding: 6px 14px;
      font-family: 'Heebo', sans-serif;
      font-size: 16px;
      cursor: pointer;
      min-width: 44px;
    }
    .qnav button.cur { border-color: var(--c-qty); color: #ffffff; }
    .qnav button.done { background: rgba(74, 222, 128, 0.18); border-color: rgba(74, 222, 128, 0.6); color: #ffffff; }

    /* ---------- כרטיס שאלה ---------- */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .q-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--c-qty);
      font-family: 'Heebo', sans-serif;
      font-weight: 700;
      font-size: 16px;
      padding: 4px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    /* השאלה והסעיפים מימין, הגרף משמאל ונעוץ בזמן הגלילה */
    .q-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 440px);
      grid-template-areas: "stem graph" "subs graph";
      grid-template-rows: auto 1fr;
      gap: 0 24px;
    }
    .q-grid.wide { grid-template-columns: minmax(0, 1fr) minmax(0, 540px); }
    /* top: שתי דיאגרמות זו לצד זו – הגרף ברוחב מלא מעל הסעיפים, לא נעוץ */
    .q-grid.top { grid-template-columns: 1fr; grid-template-areas: "stem" "graph" "subs"; grid-template-rows: auto; }
    .q-grid.top .graph { position: static; margin-bottom: 14px; }
    .q-grid.top .graph img { width: auto; max-width: 100%; max-height: none; }
    .stem { grid-area: stem; margin-bottom: 8px; }
    .subs { grid-area: subs; }
    .stem {
      font-size: 22px;
      line-height: 1.8;
      color: #f8fafc;
    }

    /* הגרף מהסריקה: מסגרת לבנה על הרקע הכהה */
    .graph {
      grid-area: graph;
      align-self: start;
      position: sticky;
      top: 84px; /* מתחת לסרגל העליון הדביק */
      background: #ffffff;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }
    .graph img { display: block; max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; margin: 0 auto; }
    .q-grid.wide .graph img { width: 100%; object-fit: contain; }

    /* ---------- סעיפים ---------- */
    /* סעיפים קצרים עומדים כמה בשורה; סעיף עם הדרכה או "נמקו" תופס שורה שלמה */
    .subs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      align-content: start;
      align-items: start; /* סעיף קצר לא נמתח לגובה של השכן שלו */
    }
    .sub {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(0,0,0,0.25);
      border-right: 4px solid var(--c-qty);
      padding: 12px 16px;
      border-radius: 0 10px 10px 0;
      font-size: 19px;
      line-height: 1.6;
    }
    .sub.full { grid-column: 1 / -1; }
    .sub.filled { border-right-color: var(--c-rate); }
    .sub .hint {
      background: rgba(251, 191, 36, 0.08);
      border-right: 3px solid var(--c-time);
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      font-size: 17px;
      line-height: 1.6;
      margin: 10px 0 4px;
      color: #fde68a;
    }
    .ans-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin-top: 10px; }
    .items { display: flex; flex-wrap: wrap; gap: 0 28px; }
    .item { white-space: nowrap; }
    .ufb { flex-basis: 100%; font-size: 16px; color: #f9a8b8; }
    .ufb.right { color: var(--c-rate); }
    .sign-hint { color: #fde68a; }
    .ufb:empty { display: none; }
    .ufb strong { color: #ffffff; }
    .reveal {
      background: none;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 15px;
      padding: 1px 12px;
      margin-right: 6px;
      cursor: pointer;
    }
    .reveal:hover { border-color: #ffffff; color: #ffffff; }
    .ans.bad { border-color: rgba(249, 168, 184, 0.7); }
    .ans.good { border-color: rgba(74, 222, 128, 0.7); }
    /* שליחה למורה */
    .hidden { display: none !important; }
    .submit-head { font-family: 'Heebo', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
    .summary { list-style: none; margin: 10px 0; font-size: 18px; }
    .summary li { padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
    .muted { color: #94a3b8; font-size: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; max-width: 420px; }
    .field label { font-size: 19px; }
    .field input, .field select {
      height: 48px;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #ffffff;
      font-family: 'Assistant', sans-serif;
      font-size: 20px;
      padding: 0 12px;
      outline: none;
    }
    .field select option { background: #1e293b; }
    .field input:focus, .field select:focus { border-color: var(--c-qty); }
    .fb { font-size: 17px; margin-top: 10px; font-weight: 600; }
    .fb:empty { display: none; }
    .fb.err { color: #f9a8b8; }
    .fb.ok { color: var(--c-rate); }

    .nocheck { flex-basis: 100%; display: block; font-size: 15px; color: #94a3b8; margin-top: 4px; }
    .intro { margin-top: 8px; color: #cbd5e1; }
    .stem table.fill { margin-top: 8px; font-size: 18px; }
    .stem table.fill td { padding: 4px 14px; }
    /* כלי בנייה: צביעת עוגה ובניית עמודות */
    .tool { margin-top: 10px; }
    .palette { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .palette button { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.2);
      color: #fff; border-radius: 20px; padding: 3px 12px; font-family: inherit; font-size: 16px; cursor: pointer; }
    .palette button.on { border-color: #ffffff; background: rgba(255,255,255,0.16); }
    .palette .sw { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .palette .cnt { color: #94a3b8; font-size: 14px; }
    .pie-svg { direction: ltr; display: block; width: 100%; max-width: 300px; margin: 0 auto; background: #fff; border-radius: 50%; touch-action: none; cursor: pointer; }
    .pie-svg path { stroke-width: 0.6; }
    .bars-svg { direction: ltr; display: block; width: 100%; max-width: 460px; background: #fff; border-radius: 12px; touch-action: none; cursor: pointer; }
    .bars-svg .g1 { stroke: #94a3b8; stroke-width: 0.8; } .bars-svg .g2 { stroke: #e2e8f0; stroke-width: 0.6; }
    .bars-svg .ax { stroke: #0f172a; stroke-width: 1.6; }
    .bars-svg text { font-size: 11px; fill: #0f172a; font-family: 'Assistant', sans-serif; }
    .bars-svg rect { fill: #8b5cf6; } .bars-svg rect.given { fill: #6b4a7e; }
    .tool.good .pie-svg, .tool.good .bars-svg { outline: 3px solid rgba(74, 222, 128, 0.8); }
    .tool.bad .pie-svg, .tool.bad .bars-svg { outline: 3px solid rgba(249, 168, 184, 0.8); }
    /* כיתוב בתוך גזרות */
    .lbl-layer { position: absolute; inset: 0; direction: ltr; pointer-events: none; }
    input.ans.cell.lbl { position: absolute; pointer-events: auto; width: 92px; height: 30px;
      font-size: 14px; background: rgba(15, 23, 42, 0.88); }
    input.ans.cell.lbl.what { transform: translate(-50%, -100%); }
    input.ans.cell.lbl.pct { transform: translate(-50%, 2px); width: 64px; }
    input.ans.cell.lbl::placeholder { color: #94a3b8; }
    .q-grid.big .pic { display: block; }
    .q-grid.top.big .pic { display: inline-block; }
    .q-grid.big .graph img { width: 100%; }
    .q-grid.top.big .graph img { width: 520px; max-width: 100%; }
    .inline-pic { background: #fff; border-radius: 12px; padding: 8px; margin: 10px 0; display: inline-block; }
    .inline-pic img { display: block; max-width: 100%; }
    table.fill.grid th { white-space: normal; font-size: 15px; }

    /* שרטוט על הגרף */
    .pic { position: relative; display: inline-block; max-width: 100%; }
    .q-grid.wide .pic { display: block; }
    .pic.drawing { cursor: crosshair; }
    #draw-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #draw-layer polyline { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linejoin: round; }
    #draw-layer circle { fill: #2563eb; stroke: #ffffff; stroke-width: 1.5; }
    .draw-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; }
    .ans-row.wide-row { flex-basis: 100%; }
    .ans-row.wide-row textarea.ans { flex: 1 1 100%; min-height: 64px; }
    .draw-note { color: #94a3b8; font-size: 17px; margin-top: 8px; }
    .ad { border: 2px dashed rgba(255,255,255,0.3); border-radius: 12px; padding: 8px 14px; margin: 8px 0; color: #e2e8f0; }

    /* טבלה למילוי */
    .tbl-wrap { overflow-x: auto; margin-top: 10px; }
    table.fill { border-collapse: collapse; font-size: 17px; }
    table.fill th, table.fill td { border: 1px solid rgba(255,255,255,0.2); padding: 3px; text-align: center; }
    table.fill th { font-weight: 400; color: #cbd5e1; padding: 3px 8px; }
    input.ans.cell.wide-cell { width: 120px; }
    input.ans.cell { width: 38px; height: 38px; flex: none; padding: 0 2px; text-align: center; font-size: 16px; }

    /* בחירה בין תשובות */
    .choice { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .choice button {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.2);
      color: #ffffff;
      border-radius: 30px;
      padding: 6px 18px;
      font-family: 'Assistant', sans-serif;
      font-size: 18px;
      cursor: pointer;
      text-align: right;
    }
    .choice button.on { border-color: var(--c-qty); background: rgba(56, 189, 248, 0.15); }
    .choice.good button.on { border-color: var(--c-rate); background: rgba(74, 222, 128, 0.15); }
    .choice.bad button.on { border-color: rgba(249, 168, 184, 0.7); }

    /* בדיקה בסוף השאלה */
    .check-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    .btn-check {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-family: 'Heebo', sans-serif;
      font-size: 17px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-check:hover { background: #38bdf8; color: #000; }
    .score { font-size: 18px; color: #cbd5e1; }
    .ans {
      flex: 1;
      min-width: 0;
      height: 46px;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-family: 'Assistant', sans-serif;
      font-size: 19px;
      padding: 0 12px;
      outline: none;
      transition: all 0.2s;
    }
    textarea.ans { height: auto; min-height: 80px; padding: 8px 12px; resize: vertical; line-height: 1.5; }
    .ans:focus { border-color: var(--c-qty); background: rgba(0, 0, 0, 0.6); }
    .ans::placeholder { color: #64748b; }
    input.ans.short { flex: 0 0 170px; width: 170px; text-align: center; padding: 0 6px; }

    .btn-step {
      background: var(--c-rate);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-family: 'Heebo', sans-serif;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-link { background: none; border: none; color: #94a3b8; text-decoration: underline; font-family: inherit; font-size: 17px; cursor: pointer; margin: 10px 8px 0; }
    .after { margin-bottom: 20px; }
    .reset { text-align: center; }
    .note { color: #94a3b8; font-size: 17px; }

    @media (max-width: 860px) {
      .q-grid, .q-grid.wide { grid-template-columns: 1fr; grid-template-areas: "stem" "graph" "subs"; grid-template-rows: auto; }
      .graph { position: static; margin-bottom: 14px; }
    }

    /* ---------- Phone layout ---------- */
    @media (max-width: 640px) {
      html { font-size: 110%; }
      .wrap { padding: 14px 0 32px; }
      .card { padding: 20px 14px; }
      .stem { font-size: 20px; }
      .sub { font-size: 18px; padding: 10px 12px; }
      .graph { padding: 8px; }
    }
  </style>
</head>
<body>
<site-header style="--tp-max:1100px"></site-header>
<div class="wrap">
  <a class="back" href="./"><i class="fa-solid fa-arrow-right"></i> כל המקבצים</a>
  <nav class="qnav" id="qnav"></nav>
  <section class="card" id="q-card"></section>
  <div class="after" id="after"></div>

  <!-- שליחה למורה: השם והכיתה רק כאן -->
  <section class="card hidden" id="submit-card">
    <div class="submit-head"><i class="fa-solid fa-paper-plane"></i> שליחה למורה</div>
    <ul class="summary" id="summary"></ul>
    <div class="field">
      <label for="student-name">שם מלא (שם פרטי ושם משפחה)</label>
      <input id="student-name" autocomplete="name">
    </div>
    <div class="field">
      <label for="student-group">כיתה</label>
      <select id="student-group">
        <option value="">בחרו…</option>
        <option>י' כנף א'</option>
        <option>י' כנף ב'</option>
      </select>
    </div>
    <button class="btn-step" onclick="submitSet()">שליחה <i class="fa-solid fa-paper-plane"></i></button>
    <p class="fb" id="submit-msg"></p>
  </section>
  <p class="reset"><button class="btn-link" onclick="resetAll()">להתחיל מחדש (מוחק את כל התשובות במקבץ הזה בדפדפן הזה)</button></p>
</div>
<site-footer style="--tp-max:1100px"></site-footer>

<script>
  const SET = GRAPH_SETS.find(s => s.id === new URLSearchParams(location.search).get('c')) || GRAPH_SETS[0];
  const QUESTIONS = SET.questions;
  const STORAGE_KEY = 'graphs-' + SET.id;
  // כתובת ה-Apps Script שמקבל את ההגשות (גיליון "גרפים – הגשות"). ריק = השליחה עוד לא מחוברת.
  const SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbxLpZXaStxIr_bdTQLp1VhZk0hOhkW8LW0jP58jS0murDzSN111MhiOVi_qnUcLsQXLaQ/exec';
  const STUDENT_KEY = 'graphs-student'; // שם וכיתה, משותפים לכל המקבצים
  document.title = 'גרפים: ' + SET.title;

  // a = התשובות, rev = תיבות שבהן גילו את היחידה, chk = שאלות שבדקו (מאז הבדיקה מסמנים נכון/לא נכון),
  // hint = תיבות שבהן ביקשו רמז על הסימן
  let state = { cur: 0, a: {}, rev: {}, chk: {}, hint: {} };

  // כל סעיף = תיבה אחת, או כמה תיבות (items / עמודות בטבלה / תאי grid ואחריהם התשובה).
  // שרטוט על הגרף = "תיבה" אחת שבה נשמרות הנקודות (JSON). מפתח: <שאלה>-<סעיף>[-<פריט>]
  const subOf = v => typeof v === 'string' ? { text: v } : v;
  function keysOf(qi, letter, sub) {
    const base = qi + '-' + letter;
    if (sub.paper) return []; // סעיף שעושים על הדף (שרטוט דיאגרמה) – בלי תיבות
    if (sub.grid) {
      const cells = [];
      sub.grid.rows.forEach((_, r) => sub.grid.cols.forEach((_, c) => cells.push(base + '-' + r + '-' + c)));
      return sub.grid.noFinal ? cells : cells.concat(base);
    }
    // טבלה עם תאים קבועים ותאים למילוי (rows, null = תא למילוי)
    if (sub.table && sub.table.rows) {
      const n = [].concat(...sub.table.rows).filter(c => c === null).length;
      return Array.from({ length: n }, (_, j) => base + '-' + j);
    }
    // גזרה בדיאגרמת עיגול = שתי תיבות: מה היא מייצגת, והאחוז
    if (sub.labels) return [].concat(...sub.labels.map((_, j) => [base + '-' + j + 'w', base + '-' + j + 'p']));
    const many = sub.items || (sub.table && sub.table.cols);
    return many ? many.map((_, j) => base + '-' + j) : [base];
  }

  // לכל תיבה: היחידה שהיא דורשת (מפתח ב-GRAPH_UNITS), התשובה מדף התשובות,
  // ושם קריא לגיליון ההגשות ("ב(2)", "ה – 4", "ז – אגס/משקל")
  const UNIT = {}, ANS = {}, CHOICE = {}, LABEL = {};
  QUESTIONS.forEach((q, qi) => Object.keys(q.subs).forEach(l => {
    const s = subOf(q.subs[l]), keys = keysOf(qi, l, s), ans = q.ans || {}, a = ans[l];
    const cells = s.grid ? [].concat(...(ans[l + '#'] || [])) : null;
    keys.forEach((k, j) => {
      const C = s.grid && s.grid.cols.length;
      LABEL[k] = s.items ? l + '(' + (j + 1) + ')'
        : s.table && s.table.rows ? l + ' – תא ' + (j + 1)
        : s.labels ? l + ' – גזרה ' + (Math.floor(j / 2) + 1) + (j % 2 ? ' (אחוז)' : ' (מה)')
        : s.table ? l + ' – ' + s.table.cols[j]
        : s.grid && j < cells.length ? l + ' – ' + s.grid.rows[Math.floor(j / C)] + '/' + s.grid.cols[j % C].replace(/ \(.*\)$/, '')
        : l;
      UNIT[k] = s.items ? s.items[j].unit : s.labels ? (j % 2 ? 'pct' : '') : s.grid && j < cells.length ? '' : s.unit;
      const want = cells && j < cells.length ? cells[j] : s.labels ? (a && a[Math.floor(j / 2)] || [])[j % 2] : Array.isArray(a) ? a[j] : a;
      if (want) ANS[k] = want;
      if (s.choices || (s.items && s.items[j].choices)) CHOICE[k] = true;
    });
  }));

  // הבדיקות עצמן ב-check.js
  const unitProblem = k => GraphCheck.unitProblem(state.a[k], UNIT[k]);
  const filled = k => !!(state.a[k] || '').trim() && !unitProblem(k);
  const correct = k => GraphCheck.isCorrect(state.a[k], ANS[k], UNIT[k], CHOICE[k]);
  const signSlip = k => GraphCheck.signSlip(state.a[k], ANS[k], UNIT[k]);
  function questionDone(qi) {
    const q = QUESTIONS[qi];
    return Object.keys(q.subs).every(l => keysOf(qi, l, subOf(q.subs[l])).every(filled));
  }

  function box(key, long) {
    return long
      ? '<textarea class="ans" data-k="' + key + '" placeholder="התשובה וההסבר שלי…"></textarea>'
      : '<input class="ans short" data-k="' + key + '" dir="auto" autocomplete="off"><span class="ufb" data-fb="' + key + '"></span>';
  }
  // תיבה גדולה. אם אין לה תשובה לבדיקה – אומרים את זה
  const longBox = key => box(key, true) + '<span class="ufb" data-fb="' + key + '"></span>' +
    (ANS[key] ? '' : '<span class="nocheck">את ההסבר הדף לא בודק, אבל חשוב לדעת להסביר!</span>');

  // שורת תשובה: [תווית] [מילים לפני] [תיבה]. את יחידת המידה התלמידים כותבים בעצמם.
  const ansRow = (key, o) => o.long
    ? '<div class="ans-row wide-row"><span class="item">' + o.label + ':</span>' + longBox(key) + '</div>'
    : o.choices ? '<div class="ans-row">' + (o.label ? '<span class="item">' + o.label + ':</span>' : '') +
      choiceBox(o.choices, key) + '</div>'
    : '<div class="ans-row">' +
      (o.label ? '<span class="item">' + o.label + ':</span>' : '') +
      (o.pre ? '<span>' + o.pre + '</span>' : '') + box(key, false) + '</div>';

  // טבלה למילוי: שורת כותרת קבועה ושורה של תיבות.
  // או rows: כל שורה = [כותרת, תא, תא...], תא null = תיבה (רחבה, למשל לטווח "200–51")
  function tableBox(t, keys) {
    const cell = k => '<td><input class="ans cell" data-k="' + k + '" inputmode="decimal" autocomplete="off"></td>';
    if (t.rows) {
      let j = 0;
      return '<div class="tbl-wrap"><table class="fill">' + t.rows.map(row => '<tr><th>' + row[0] + '</th>' +
        row.slice(1).map(c => c === null ? cell(keys[j++]).replace('ans cell', 'ans cell wide-cell').replace(' inputmode="decimal"', '') : '<td>' + c + '</td>').join('') +
        '</tr>').join('') + '</table></div>';
    }
    return '<div class="tbl-wrap"><table class="fill"><tr><th>' + t.head + '</th>' +
      t.cols.map(c => '<td>' + c + '</td>').join('') + '</tr><tr><th>' + t.label + '</th>' +
      keys.map(cell).join('') + '</tr></table></div>';
  }

  // טבלה אופקית (grid): שורת כותרת עם הפריטים (rows), ושורה למילוי לכל עמודת נתון (cols).
  // אחריה תיבת התשובה של הסעיף.
  function gridBox(s, keys) {
    const g = s.grid, C = g.cols.length;
    return (s.intro ? '<p class="intro">' + s.intro + '</p>' : '') +
      '<div class="tbl-wrap"><table class="fill grid"><tr><th>' + g.head + '</th>' +
      g.rows.map(r => '<th>' + r + '</th>').join('') + '</tr>' +
      g.cols.map((col, c) => '<tr><th>' + col + '</th>' + g.rows.map((_, r) =>
        '<td><input class="ans cell' + (g.wide ? ' wide-cell' : '') + '" data-k="' + keys[r * C + c] + '"' +
        (g.wide ? '' : ' inputmode="decimal"') + ' autocomplete="off"></td>').join('') + '</tr>').join('') +
      '</table></div>' + (g.noFinal ? '' : ansRow(keys[keys.length - 1], { pre: s.pre, unit: s.unit }));
  }

  // שרטוט על הגרף: הוראה, כפתור ניקוי והערה
  const drawBox = (s, key) => '<div class="draw-tools"><span class="draw-note">' +
    (s.draw === 'point' ? 'לחצו על הגרף כדי לסמן את הנקודה.'
      : s.draw === 'points' ? 'לחצו על הגרף כדי לסמן נקודות. לחיצה על נקודה שסימנתם מוחקת אותה.'
      : 'לחצו על הנקודות בגרף, אחת אחרי השנייה. כל שתי נקודות מתחברות בקו.') +
    '</span><button type="button" class="reveal" onclick="clearDraw(\'' + key + '\')">ניקוי</button></div>' +
    '<span class="ufb" data-fb="' + key + '"></span>' +
    (ANS[key] ? '' : '<span class="nocheck">את השרטוט הדף לא בודק, אבל חשוב לדעת לשרטט!</span>');

  // תיבות כתיבה בתוך הגזרות של דיאגרמת עיגול (labels = מרכזי הגזרות, 0–1 ביחס לתמונה)
  function labelLayer(qi, q) {
    const l = Object.keys(q.subs).find(x => subOf(q.subs[x]).labels);
    if (!l) return '';
    const s = subOf(q.subs[l]), keys = keysOf(qi, l, s);
    const box = (k, p, cls, ph) => '<input class="ans cell lbl ' + cls + '" data-k="' + k + '" dir="auto" autocomplete="off"' +
      ' placeholder="' + ph + '" style="left:' + p[0] * 100 + '%;top:' + p[1] * 100 + '%">';
    return '<div class="lbl-layer">' + s.labels.map((p, j) =>
      box(keys[2 * j], p, 'what', s.labelHint || 'מה?') + box(keys[2 * j + 1], p, 'pct', '%')).join('') + '</div>';
  }

  // בחירה בין תשובות
  const choiceBox =(choices, key) => '<div class="choice">' +
    choices.map(c => '<button type="button" data-choice="' + key + '">' + c + '</button>').join('') +
    '</div><span class="ufb" data-fb="' + key + '"></span>';

  function build() {
    const qi = state.cur, q = QUESTIONS[qi];

    const subs = Object.keys(q.subs).map(l => {
      const s = subOf(q.subs[l]);
      const long = s.long || /נמקו|הסבירו/.test(s.text);
      const keys = keysOf(qi, l, s);
      const tool = (attr, note) => '<p class="draw-note">' + note + '</p><div class="tool" data-' + attr + '="' + keys[0] + '"></div>' +
        '<div class="draw-tools"><button type="button" class="reveal" onclick="clearTool(\'' + keys[0] + '\')">ניקוי</button></div>' +
        '<span class="ufb" data-fb="' + keys[0] + '"></span>';
      const rows = s.piedraw ? tool('piedraw', 'לחצו על שפת העיגול כדי להוסיף קו חלוקה (לחיצה על קו קיים מוחקת אותו). אחר כך בחרו ענף ולחצו בתוך גזרה כדי לצבוע אותה. לא צריך דיוק – רק גדלים סבירים.')
        : s.pie ? tool('pie','בחרו קבוצה, ואז לחצו על גזרות בעיגול (או גררו עליהן) כדי לצבוע אותן. ליד כל קבוצה רואים כמה אחוזים צבעתם.')
        : s.bars ? tool('bars', 'לחצו בתוך כל עמודה בגובה המתאים (אפשר גם לגרור).')
        : s.labels ?'<p class="draw-note">בכל גזרה בדיאגרמה יש שתי תיבות: למעלה – מה הגזרה מייצגת, למטה – האחוז. "בדיקת התשובות" בודקת גם אותן.</p>'
        : s.paper ?'<p class="draw-note">את הסעיף הזה עושים במחברת. הדף לא בודק אותו, אבל חשוב לדעת לשרטט!</p>'
        : s.draw ? drawBox(s, keys[0])
        : s.grid ? gridBox(s, keys)
        : s.table ? tableBox(s.table, keys)
        : s.choices ? choiceBox(s.choices, keys[0])
        : s.items ? '<div class="items">' + s.items.map((o, j) => ansRow(keys[j], o)).join('') + '</div>'
        : long ? '<div class="ans-row">' + longBox(keys[0]) + '</div>' : ansRow(keys[0], s);
      // שורה שלמה: נימוק, הדרכה, טבלה, שרטוט, בחירה, או יותר משתי תיבות (שלא יימתח לאורך ליד סעיף קצר)
      const full = long || s.hint || s.table || s.grid || s.draw || s.paper || s.labels || s.pie || s.piedraw || s.bars || s.choices ||
        (s.items && (s.items.length > 2 || s.items.some(o => o.long)));
      // cont = המשך של הסעיף הקודם (בלי אות משלו)
      return '<div class="sub' + (full ? ' full' : '') + '" data-sub="' + l + '"><div>' +
        (s.cont ? '' : '<strong>' + l + '.</strong> ') + s.text +
        (s.hint ? '<div class="hint">' + s.hint + '</div>' : '') + '</div>' + rows + '</div>';
    }).join('');

    document.getElementById('q-card').innerHTML =
      '<span class="q-badge">' + q.part + ' · שאלה ' + (qi + 1) + '</span>' +
      '<div class="q-grid' + (q.wide ? ' wide' : '') + (q.top ? ' top' : '') + (q.big ? ' big' : '') + '">' +
        '<div class="stem">' + q.stem + '</div>' +
        '<div class="graph"><div class="pic"><img id="graph-img" src="img/' + q.img + '.png" alt="הגרף של שאלה ' + (qi + 1) + '">' +
        '<svg id="draw-layer"></svg>' + labelLayer(qi, q) + '</div></div>' +
        '<div class="subs">' + subs + '</div>' +
      '</div>' +
      '<div class="check-row"><button class="btn-check" onclick="checkQuestion()"><i class="fa-solid fa-check"></i> בדיקת התשובות</button>' +
      '<span class="score" id="score"></span></div>';

    document.querySelectorAll('[data-k]').forEach(el => {
      el.value = state.a[el.dataset.k] || '';
      el.addEventListener('input', () => {
        state.a[el.dataset.k] = el.value;
        persist();
        render();
      });
      el.addEventListener('blur', render);
    });
    document.querySelectorAll('[data-choice]').forEach(b => {
      b.addEventListener('click', () => {
        state.a[b.dataset.choice] = b.textContent;
        persist();
        render();
      });
    });

    // שרטוט: לחיצה על הגרף מוסיפה נקודה לסעיף השרטוט של השאלה (אם יש)
    const img = document.getElementById('graph-img');
    const drawL = Object.keys(q.subs).find(l => subOf(q.subs[l]).draw);
    img.parentElement.classList.toggle('drawing', !!drawL);
    img.addEventListener('load', render);
    if (drawL) {
      const s = subOf(q.subs[drawL]), key = qi + '-' + drawL;
      img.parentElement.addEventListener('click', e => {
        const r = img.getBoundingClientRect();
        let p = [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
        // נקודה "מגנטית" קרובה
        const near = (s.snap || []).find(n => Math.hypot(n[0] - p[0], (n[1] - p[1]) * r.height / r.width) < 0.04);
        if (near) p = near.slice();
        // רשת: הנקודה נתפסת לצומת הקרוב (xs, ys = מיקומי הקווים בתמונה)
        if (s.snapGrid) {
          const closest = (list, x) => list.reduce((a, b) => Math.abs(b - x) < Math.abs(a - x) ? b : a);
          p = [closest(s.snapGrid.xs, p[0]), closest(s.snapGrid.ys, p[1])];
        }
        p = p.map(x => Math.round(x * 1000) / 1000);
        let pts;
        if (s.draw === 'point') pts = [p];
        else if (s.draw === 'points') {
          // לחיצה על נקודה קיימת מוחקת אותה
          const old = drawPoints(key), same = old.findIndex(o => Math.abs(o[0] - p[0]) < 0.01 && Math.abs(o[1] - p[1]) < 0.01);
          pts = same >= 0 ? old.filter((_, i) => i !== same) : old.concat([p]);
        } else pts = drawPoints(key).concat([p]);
        state.a[key] = JSON.stringify(pts);
        persist();
        render();
      });
    }
    // דיאגרמת עיגול לצביעה ודיאגרמת עמודות לבנייה
    Object.keys(q.subs).forEach(l => {
      const s = subOf(q.subs[l]), key = qi + '-' + l;
      if (s.pie) initPie(document.querySelector('[data-pie="' + key + '"]'), s.pie, key);
      if (s.piedraw) initPieDraw(document.querySelector('[data-piedraw="' + key + '"]'), s.piedraw, key);
      if (s.bars) initBars(document.querySelector('[data-bars="' + key + '"]'), s.bars, key);
    });
    render();
  }

  // ---------- כלי בנייה ----------
  const TOOL_COLORS = ['#f59e0b', '#3b82f6', '#22c55e', '#ec4899', '#a855f7', '#ef4444'];

  function toolValue(key, fallback) {
    try { return JSON.parse(state.a[key]) || fallback; } catch (e) { return fallback; }
  }

  // צביעת גזרות: בוחרים קבוצה ומעבירים את העכבר/האצבע על העיגול. n = מספר הגזרות
  function initPie(el, p, key) {
    const n = p.n;
    let arr = toolValue(key, Array(n).fill(-1)), cur = 0, down = false;
    const path = i => {
      const a0 = i / n * 2 * Math.PI, a1 = (i + 1) / n * 2 * Math.PI, pt = a => (100 * Math.sin(a)).toFixed(2) + ',' + (-100 * Math.cos(a)).toFixed(2);
      return 'M0,0 L' + pt(a0) + ' A100,100 0 0 1 ' + pt(a1) + ' Z';
    };
    el.innerHTML = '<div class="palette">' + p.groups.map((g, i) =>
      '<button type="button" data-g="' + i + '"><span class="sw" style="background:' + TOOL_COLORS[i] + '"></span>' + g +
      ' <span class="cnt"></span></button>').join('') +
      '<button type="button" data-g="-1"><i class="fa-solid fa-eraser"></i> מחק</button></div>' +
      '<svg class="pie-svg" viewBox="-104 -104 208 208">' +
      arr.map((_, i) => '<path d="' + path(i) + '" data-i="' + i + '" />').join('') + '</svg>';
    const svg = el.querySelector('svg'), paths = svg.querySelectorAll('path');
    function draw() {
      paths.forEach((pa, i) => {
        pa.style.fill = arr[i] >= 0 ? TOOL_COLORS[arr[i]] : '#ffffff';
        pa.style.stroke = n > 20 ? (arr[i] >= 0 ? TOOL_COLORS[arr[i]] : '#e2e8f0') : '#64748b';
      });
      el.querySelectorAll('[data-g]').forEach(b => {
        const g = +b.dataset.g;
        b.classList.toggle('on', g === cur);
        const c = b.querySelector('.cnt');
        if (c) c.textContent = '(' + Math.round(arr.filter(x => x === g).length * 100 / n) + '%)';
      });
    }
    function paint(e) {
      const r = svg.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(dx, dy) > r.width / 2) return;
      let a = Math.atan2(dx, -dy);
      if (a < 0) a += 2 * Math.PI;
      const i = Math.min(n - 1, Math.floor(a / (2 * Math.PI) * n));
      if (arr[i] !== cur) { arr[i] = cur; draw(); }
    }
    const save = () => { state.a[key] = JSON.stringify(arr); persist(); render(); };
    el.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => { cur = +b.dataset.g; draw(); }));
    svg.addEventListener('pointerdown', e => { down = true; svg.setPointerCapture(e.pointerId); paint(e); });
    svg.addEventListener('pointermove', e => { if (down) paint(e); });
    svg.addEventListener('pointerup', () => { down = false; save(); });
    el.clearTool = () => { arr = Array(n).fill(-1); draw(); save(); };
    draw();
  }

  // בניית עמודות: לוחצים (או גוררים) בעמודה בגובה הרצוי. given = [עמודה, ערך] שכבר מסורטטת
  function initBars(el, b, key) {
    const C = b.cats.length, X0 = 46, X1 = 396, Y0 = 232, Y1 = 14, cw = (X1 - X0) / C;
    let arr = toolValue(key, b.cats.map((_, i) => b.given && b.given[0] === i ? b.given[1] : 0)), down = false;
    const y = v => Y0 - v / b.max * (Y0 - Y1);
    let grid = '';
    for (let v = 0; v <= b.max; v += b.step) {
      const major = v % b.label === 0;
      grid += '<line x1="' + X0 + '" x2="' + X1 + '" y1="' + y(v) + '" y2="' + y(v) + '" class="' + (major ? 'g1' : 'g2') + '"/>' +
        (major ? '<text x="' + (X0 - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + b.unit + '</text>' : '');
    }
    el.innerHTML = '<svg class="bars-svg" viewBox="0 0 400 290">' + grid +
      b.cats.map((c, i) => '<rect data-i="' + i + '"/>' +
        '<text x="' + (X0 + cw * (i + 0.5)) + '" y="' + (Y0 + 18) + '" text-anchor="middle" class="cat">' + c.split('|')[0] + '</text>' +
        (c.includes('|') ? '<text x="' + (X0 + cw * (i + 0.5)) + '" y="' + (Y0 + 34) + '" text-anchor="middle" class="cat">' + c.split('|')[1] + '</text>' : '')).join('') +
      '<line x1="' + X0 + '" x2="' + X0 + '" y1="' + Y1 + '" y2="' + Y0 + '" class="ax"/><line x1="' + X0 + '" x2="' + X1 + '" y1="' + Y0 + '" y2="' + Y0 + '" class="ax"/></svg>';
    const svg = el.querySelector('svg'), rects = svg.querySelectorAll('rect');
    function draw() {
      rects.forEach((r, i) => {
        r.setAttribute('x', X0 + cw * (i + 0.2)); r.setAttribute('width', cw * 0.6);
        r.setAttribute('y', y(arr[i])); r.setAttribute('height', Y0 - y(arr[i]));
        r.setAttribute('class', b.given && b.given[0] === i ? 'given' : '');
      });
    }
    function set(e) {
      const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * 400, sy = (e.clientY - r.top) / r.height * 290;
      const i = Math.floor((sx - X0) / cw);
      if (i < 0 || i >= C || (b.given && b.given[0] === i)) return;
      const v = Math.max(0, Math.min(b.max, Math.round((Y0 - sy) / (Y0 - Y1) * b.max / b.step) * b.step));
      if (arr[i] !== v) { arr[i] = v; draw(); }
    }
    const save = () => { state.a[key] = JSON.stringify(arr); persist(); render(); };
    svg.addEventListener('pointerdown', e => { down = true; svg.setPointerCapture(e.pointerId); set(e); });
    svg.addEventListener('pointermove', e => { if (down) set(e); });
    svg.addEventListener('pointerup', () => { down = false; save(); });
    el.clearTool = () => { arr = b.cats.map((_, i) => b.given && b.given[0] === i ? b.given[1] : 0); draw(); save(); };
    draw();
  }

  // עוגה בהערכה: מוסיפים קווי חלוקה בלחיצה על שפת העיגול, וצובעים גזרות בלחיצה בפנים.
  // נשמר כ-{ b: מיקומי הקווים (0–1 מלמעלה, עם כיוון השעון), g: הקבוצה של כל גזרה }
  function initPieDraw(el, p, key) {
    let d = toolValue(key, { b: [], g: [-1] }), cur = 0;
    el.innerHTML = '<div class="palette">' + p.groups.map((g, i) =>
      '<button type="button" data-g="' + i + '"><span class="sw" style="background:' + TOOL_COLORS[i] + '"></span>' + g + '</button>').join('') +
      '<button type="button" data-g="-1"><i class="fa-solid fa-eraser"></i> מחק צבע</button></div>' +
      '<svg class="pie-svg" viewBox="-108 -108 216 216"></svg>';
    const svg = el.querySelector('svg');
    const pt = (f, r) => (r * Math.sin(f * 2 * Math.PI)).toFixed(2) + ',' + (-r * Math.cos(f * 2 * Math.PI)).toFixed(2);
    const k = () => Math.max(1, d.b.length);
    // הגזרה i: מהקו i עד הקו הבא (בעיגול)
    const span = i => d.b.length < 2 ? [d.b[0] || 0, (d.b[0] || 0) + 1] : [d.b[i], d.b[(i + 1) % k()] + (i + 1 === k() ? 1 : 0)];
    const sectorAt = f => {
      for (let i = 0; i < k(); i++) {
        const [s, e] = span(i);
        if ((f >= s && f < e) || (f + 1 >= s && f + 1 < e)) return i;
      }
      return 0;
    };
    function draw() {
      let h = '<circle r="100" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>';
      for (let i = 0; i < k(); i++) {
        const [s, e] = span(i), g = d.g[i];
        if (g === undefined || g < 0) continue;
        h += d.b.length < 2 ? '<circle r="100" fill="' + TOOL_COLORS[g] + '"/>'
          : '<path d="M0,0 L' + pt(s, 100) + ' A100,100 0 ' + (e - s > 0.5 ? 1 : 0) + ' 1 ' + pt(e, 100) + ' Z" fill="' + TOOL_COLORS[g] + '"/>';
      }
      h += d.b.map(f => '<line x1="0" y1="0" x2="' + pt(f, 100).replace(',', '" y2="') + '" stroke="#0f172a" stroke-width="1.6"/>' +
        '<circle cx="' + pt(f, 100).replace(',', '" cy="') + '" r="3.2" fill="#0f172a"/>').join('');
      h += '<circle r="100" fill="none" stroke="#0f172a" stroke-width="1.5"/><circle r="2.5" fill="#0f172a"/>';
      svg.innerHTML = h;
      el.querySelectorAll('[data-g]').forEach(b => b.classList.toggle('on', +b.dataset.g === cur));
    }
    const save = () => { state.a[key] = JSON.stringify(d); persist(); render(); };
    svg.addEventListener('pointerdown', e => {
      const r = svg.getBoundingClientRect(), dx = (e.clientX - r.left) / r.width * 216 - 108, dy = (e.clientY - r.top) / r.height * 216 - 108;
      const dist = Math.hypot(dx, dy);
      if (dist > 108) return;
      let f = Math.atan2(dx, -dy) / (2 * Math.PI);
      if (f < 0) f += 1;
      if (dist > 82) {
        // על השפה: מוחקים קו קרוב, או מוסיפים קו חדש. הגזרה החדשה מקבלת את הצבע של הגזרה שחולקה
        const near = d.b.findIndex(x => Math.min(Math.abs(x - f), 1 - Math.abs(x - f)) < 0.012);
        if (near >= 0) {
          if (d.b.length > 1) d.g.splice(near, 1); else d.g = [d.g[0]];
          d.b.splice(near, 1);
        } else {
          const i = sectorAt(f), g = d.g[i] === undefined ? -1 : d.g[i];
          d.b.push(f);
          const order = d.b.map((x, j) => [x, j]).sort((a, c) => a[0] - c[0]);
          d.b = order.map(o => o[0]);
          if (d.b.length === 1) d.g = [g];
          else {
            // ממפים מחדש: כל גזרה מקבלת את הצבע של הגזרה הישנה שבה נמצאת נקודת ההתחלה שלה
            const old = d.g.slice(), oldB = d.b.filter(x => x !== f);
            const oldSector = x => {
              if (oldB.length < 2) return 0;
              for (let j = 0; j < oldB.length; j++) {
                const s = oldB[j], e2 = oldB[(j + 1) % oldB.length] + (j + 1 === oldB.length ? 1 : 0);
                if ((x >= s && x < e2) || (x + 1 >= s && x + 1 < e2)) return j;
              }
              return 0;
            };
            d.g = d.b.map(x => { const v = old[oldSector(x)]; return v === undefined ? -1 : v; });
          }
        }
      } else {
        d.g[sectorAt(f)] = cur;
      }
      draw();
      save();
    });
    el.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => { cur = +b.dataset.g; draw(); }));
    el.clearTool = () => { d = { b: [], g: [-1] }; draw(); save(); };
    draw();
  }

  function clearTool(key) {
    const el = document.querySelector('[data-pie="' + key + '"],[data-bars="' + key + '"],[data-piedraw="' + key + '"]');
    if (el && el.clearTool) el.clearTool();
  }

  function drawPoints(key) {
    try { return JSON.parse(state.a[key] || '[]'); } catch (e) { return []; }
  }

  function clearDraw(key) {
    delete state.a[key];
    persist();
    render();
  }

  // מציירים על הגרף את הנקודות (והקווים) של סעיף השרטוט
  function renderDrawing() {
    const qi = state.cur, q = QUESTIONS[qi], img = document.getElementById('graph-img');
    const svg = document.getElementById('draw-layer');
    const drawL = Object.keys(q.subs).find(l => subOf(q.subs[l]).draw);
    if (!drawL || !img.naturalWidth) { svg.innerHTML = ''; return; }
    const W = img.naturalWidth, H = img.naturalHeight, s = subOf(q.subs[drawL]);
    const pts = drawPoints(qi + '-' + drawL).map(p => [p[0] * W, p[1] * H]);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = (s.draw === 'line' && pts.length > 1
        ? '<polyline points="' + pts.map(p => p.join(',')).join(' ') + '" />' : '') +
      pts.map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (s.draw === 'line' ? 5 : 7) + '" />').join('');
  }

  function render() {
    const qi = state.cur, q = QUESTIONS[qi];
    renderDrawing();
    Object.keys(q.subs).forEach(l => {
      // פס ירוק: הסעיף מולא (ואחרי בדיקה – גם נכון)
      const done = keysOf(qi, l, subOf(q.subs[l])).every(k => state.chk[qi] && ANS[k] ? correct(k) : filled(k));
      document.querySelector('.sub[data-sub="' + l + '"]').classList.toggle('filled', done);
    });

    // הערה מתחת לכל תיבה – רק כשלא מקלידים בה. קודם היחידה (אפשר לבקש לגלות אותה),
    // ואחרי "בדיקת התשובות" – נכון או לא נכון.
    const checked = !!state.chk[qi];
    let right = 0, total = 0;
    document.querySelectorAll('[data-choice]').forEach(b => b.classList.toggle('on', state.a[b.dataset.choice] === b.textContent));
    // תאי טבלה: רק מסגרת ירוקה/אדומה
    document.querySelectorAll('.cell').forEach(el => {
      const k = el.dataset.k, testable = checked && ANS[k], ok = testable && correct(k);
      if (testable) { total++; if (ok) right++; }
      const show = testable && (state.a[k] || '').trim() && el !== document.activeElement;
      el.classList.toggle('good', !!show && ok);
      el.classList.toggle('bad', !!show && !ok);
    });
    document.querySelectorAll('[data-fb]').forEach(fb => {
      const k = fb.dataset.fb;
      const el = document.querySelector('[data-k="' + k + '"]') || document.querySelector('[data-pie="' + k + '"],[data-bars="' + k + '"],[data-piedraw="' + k + '"]') || fb.previousElementSibling;
      const v = (state.a[k] || '').trim(), unit = unitProblem(k);
      const testable = checked && ANS[k];
      const ok = testable && correct(k);
      if (testable) { total++; if (ok) right++; }
      let html = '', good = false;
      if (el !== document.activeElement && v) {
        if (unit) {
          html = state.rev[k] ? unit + ' היחידה כאן: <strong>' + GRAPH_UNIT_NAMES[UNIT[k]] + '</strong>'
            : unit + '<button class="reveal" onclick="revealUnit(\'' + k + '\')">לגלות את היחידה</button>';
        } else if (testable) {
          good = ok;
          html = ok ? '<i class="fa-solid fa-check"></i> נכון' : 'לא נכון. נסו שוב.';
          // עוגה בהערכה: איזו גזרה גדולה או קטנה מדי
          if (!ok && ANS[k].estimate) {
            const s = subOf(QUESTIONS[qi].subs[k.split('-')[1]]);
            html += '<br><span class="sign-hint">' + GraphCheck.pieEstimateAdvice(state.a[k], ANS[k].estimate, s.piedraw.groups).join('<br>') + '</span>';
          }
          if (signSlip(k)) {
            html += state.hint[k]
              ? '<br><span class="sign-hint">' + (GRAPH_SIGN_HINTS[UNIT[k]] || GRAPH_SIGN_HINTS.other) + '</span>'
              : '<button class="reveal" onclick="showHint(\'' + k + '\')">רמז</button>';
          }
        }
      }
      // מחליפים רק כשההודעה השתנתה, כדי שלחיצה על הכפתור לא תלך לאיבוד
      if (fb.dataset.html !== html) { fb.innerHTML = html; fb.dataset.html = html; }
      fb.classList.toggle('right', good);
      el.classList.toggle('good', good);
      el.classList.toggle('bad', !!html && !good);
    });
    document.getElementById('score').textContent = checked
      ? (right === total ? 'כל התשובות נכונות! כל הכבוד.' : 'נכונות: ' + right + ' מתוך ' + total + '.')
      : '';

    const last = qi === QUESTIONS.length - 1;
    document.getElementById('after').innerHTML = last
      ? '<button class="btn-step" onclick="showSubmit()">סיימתי את המקבץ – שליחה למורה <i class="fa-solid fa-paper-plane"></i></button>'
      : '<button class="btn-step" onclick="goTo(' + (qi + 1) + ')">לשאלה הבאה <i class="fa-solid fa-arrow-left"></i></button>';

    document.getElementById('qnav').innerHTML =
      '<span class="title">' + SET.title + '</span>' +
      QUESTIONS.map((_, i) =>
        '<button class="' + (i === qi ? 'cur ' : '') + (questionDone(i) ? 'done' : '') + '" onclick="goTo(' + i + ')">' +
        (i + 1) + '</button>').join('') +
      '<button onclick="showSubmit()"><i class="fa-solid fa-paper-plane"></i> שליחה</button>';
  }

  // ---------- שליחה למורה ----------
  // נכונות בכל שאלה, לפי אותה בדיקה של "בדיקת התשובות" (גם אם לא לחצו עליה)
  function questionScore(qi) {
    const q = QUESTIONS[qi];
    let right = 0, total = 0;
    Object.keys(q.subs).forEach(l => keysOf(qi, l, subOf(q.subs[l])).forEach(k => {
      if (!ANS[k]) return;
      total++;
      if (correct(k)) right++;
    }));
    return { right, total };
  }

  function showSubmit() {
    const scores = QUESTIONS.map((_, i) => questionScore(i));
    document.getElementById('summary').innerHTML = scores.map((s, i) =>
      '<li>שאלה ' + (i + 1) + ': ' + s.right + ' מתוך ' + s.total + ' נכונות' +
      (state.chk[i] ? '' : ' <span class="muted">(עוד לא לחצתם "בדיקת התשובות")</span>') + '</li>').join('');
    const card = document.getElementById('submit-card');
    card.classList.remove('hidden');
    card.scrollIntoView({ behavior: 'smooth' });
  }

  // כל התשובות כטקסט קריא לגיליון: שורה לכל שאלה, "א: 10 ק"מ ✓ · ב: 5 ✗ · ג: —"
  function answersText() {
    return QUESTIONS.map((q, qi) => 'שאלה ' + (qi + 1) + ': ' + Object.keys(q.subs).map(l => {
      const s = subOf(q.subs[l]);
      // רק תיבות שמילאו; סעיף ריק לגמרי = "א: —"
      const parts = keysOf(qi, l, s).filter(k => (state.a[k] || '').trim()).map(k => {
        const v = state.a[k].trim();
        const mark = ANS[k] ? (correct(k) ? ' ✓' : ' ✗') : '';
        return LABEL[k] + ': ' + (s.draw || s.pie || s.piedraw || s.bars ? 'שורטט' : v.replace(/\s+/g, ' ')) + mark;
      });
      return parts.length ? parts.join(' · ') : l + ': —';
    }).join(' · ')).join('\n');
  }

  // רק הטעויות: "ש1 א(2): 40 (חסרה יחידת מידה.)" · "ש2 ב: 13 מעלות"
  function mistakesText() {
    const out = [];
    QUESTIONS.forEach((q, qi) => Object.keys(q.subs).forEach(l => keysOf(qi, l, subOf(q.subs[l])).forEach(k => {
      const v = (state.a[k] || '').trim();
      if (!v || !ANS[k] || correct(k)) return;
      const unit = unitProblem(k);
      out.push('ש' + (qi + 1) + ' ' + LABEL[k] + ': ' + (subOf(q.subs[l]).draw || subOf(q.subs[l]).pie || subOf(q.subs[l]).piedraw || subOf(q.subs[l]).bars ? 'שרטוט' : v.replace(/\s+/g, ' ')) +
        (unit ? ' (' + unit + ')' : ''));
    })));
    return out.join('\n');
  }

  // רק הנימוקים וההסברים (תיבות גדולות)
  function reasonsText() {
    const out = [];
    QUESTIONS.forEach((q, qi) => Object.keys(q.subs).forEach(l => {
      const s = subOf(q.subs[l]), keys = keysOf(qi, l, s);
      keys.forEach((k, j) => {
        const v = (state.a[k] || '').trim();
        const long = s.items ? s.items[j].long : (s.long || /נמקו|הסבירו/.test(s.text));
        if (v && long) out.push('ש' + (qi + 1) + ' ' + l + ': ' + v.replace(/\s+/g, ' '));
      });
    }));
    return out.join('\n');
  }

  function submitSet() {
    const msg = document.getElementById('submit-msg');
    const student = { name: document.getElementById('student-name').value.trim(), group: document.getElementById('student-group').value };
    try { localStorage.setItem(STUDENT_KEY, JSON.stringify(student)); } catch (e) {}
    if (student.name.split(/\s+/).length < 2 || !student.group) {
      msg.className = 'fb err';
      msg.textContent = 'כתבו שם פרטי ושם משפחה ובחרו כיתה, כדי שאדע בדיוק של מי ההגשה 🙂';
      return;
    }
    if (!SUBMIT_URL) {
      msg.className = 'fb err';
      msg.textContent = 'השליחה עוד לא מחוברת. התשובות שמורות בדפדפן הזה.';
      return;
    }
    const scores = QUESTIONS.map((_, i) => questionScore(i));
    const sum = scores.reduce((a, s) => ({ right: a.right + s.right, total: a.total + s.total }), { right: 0, total: 0 });
    const payload = {
      form: 'graphs', name: student.name, group: student.group, set: SET.title,
      score: sum.right + ' מתוך ' + sum.total,
      perQuestion: scores.map((s, i) => (i + 1) + ': ' + s.right + '/' + s.total).join(' · '),
      checked: Object.keys(state.chk).filter(i => state.chk[i]).map(i => +i + 1).join(', '),
      unitReveals: Object.keys(state.rev).length,
      hints: Object.keys(state.hint).length,
      answers: answersText(),
      mistakes: mistakesText(),
      reasons: reasonsText()
    };
    msg.className = 'fb';
    msg.textContent = 'שולחים...';
    fetch(SUBMIT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
      .then(() => { msg.className = 'fb ok'; msg.textContent = 'נשלח! כל הכבוד על העבודה.'; })
      .catch(() => { msg.className = 'fb err'; msg.textContent = 'השליחה נכשלה. בדקו את החיבור לאינטרנט ונסו שוב.'; });
  }

  function checkQuestion() {
    state.chk[state.cur] = true;
    persist();
    render();
  }

  function showHint(k) {
    state.hint[k] = true;
    persist();
    render();
  }

  function revealUnit(k) {
    state.rev[k] = true;
    persist();
    render();
  }

  function goTo(i) {
    state.cur = i;
    document.getElementById('submit-card').classList.add('hidden');
    persist();
    build();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- שמירה בדפדפן ----------

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && saved.a) state = Object.assign(state, saved);
      state.rev = state.rev || {};
      state.chk = state.chk || {};
      state.hint = state.hint || {};
    } catch (e) {}
    // set.html?c=rate&q=3 פותח ישר את שאלה 3
    const qp = +new URLSearchParams(location.search).get('q');
    if (qp) state.cur = qp - 1;
    if (!(state.cur >= 0 && state.cur < QUESTIONS.length)) state.cur = 0;
    try {
      const st = JSON.parse(localStorage.getItem(STUDENT_KEY)) || {};
      document.getElementById('student-name').value = st.name || '';
      document.getElementById('student-group').value = st.group || '';
    } catch (e) {}
  }

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function resetAll() {
    if (!confirm('למחוק את כל התשובות במקבץ הזה ולהתחיל מחדש?')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    location.reload();
  }

  if (QUESTIONS.length) {
    load();
    build();
    if (location.hash === '#send') showSubmit(); // קישור ישר לכרטיס השליחה
  } else {
    document.getElementById('q-card').innerHTML = '<p class="note">המקבץ הזה עוד לא מוכן.</p>';
    document.querySelector('.reset').remove();
  }
</script>
