        }

        default:
          return `<div class="p-8 text-center text-slate-400">גרף בטעינה...</div>`;
      }
    }
  </script>

  <script>
    // Formatting raw text into clean paragraphs and formatted items
    function formatQuestionText(text) {
      const lines = text.split('\n');
      let html = '';
      
      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        // Sub-clause items like "א.", "ב.", "ג."
        if (/^[א-י]\./.test(trimmed)) {
          html += `
            <div class="mt-4 flex items-start gap-2.5">
              <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-indigo-100 text-indigo-800 font-black text-sm shrink-0 mt-0.5 shadow-sm">
                ${trimmed.charAt(0)}
              </span>
              <div class="flex-1 font-medium text-slate-800">
                ${trimmed.substring(2).trim()}
              </div>
            </div>
          `;
        } 
        // Hints or specific sub-points like "(1)", "(2)"
        else if (/^\(\d+\)/.test(trimmed)) {
          html += `
            <div class="ms-8 mt-1.5 flex items-start gap-2 text-slate-700">
              <span class="font-bold text-indigo-600">${trimmed.match(/^\(\d+\)/)[0]}</span>
              <span>${trimmed.replace(/^\(\d+\)/, '').trim()}</span>
            </div>
          `;
        } 
        // Guidance / hint lines
        else if (trimmed.includes('הדרכה:')) {
          html += `
            <div class="my-2 p-3 bg-amber-50 border-r-4 border-amber-400 rounded-xl text-amber-900 text-sm">
              ${trimmed}
            </div>
          `;
        } 
        // Default text paragraph
        else {
          html += `<p class="mt-2 text-slate-800 leading-relaxed font-normal">${trimmed}</p>`;
        }
      });

      return html;
    }

    // Creating full HTML card for a question
    function createQuestionCardHTML(q, isSingle = true) {
      const s = textSizes[fontSizeDelta.toString()];
      const currentScale = cardGraphScales[q.id] || 1;

      return `
        <div class="question-card bg-white rounded-3xl border border-slate-200 shadow-md hover:shadow-lg transition-all p-5 sm:p-7 relative overflow-hidden" id="card-${q.id}">
          
          <!-- Category & Question Badge Header -->
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-4 mb-5">
            <div class="flex items-center gap-3">
              <span class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-700 text-white font-black text-sm sm:text-base shadow-sm">
                שאלה ${q.sourceNum}
              </span>
              <div>
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 block">${q.categoryName}</span>
                <h3 class="${s.title} font-black text-slate-900">${q.title}</h3>
              </div>
            </div>
            
            <div class="flex items-center gap-2">
              <button onclick="toggleAnswer(${q.id})" id="btn-ans-${q.id}" class="no-print px-4 py-2 rounded-xl text-xs sm:text-sm font-bold border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 hover:border-indigo-200 text-slate-700 transition flex items-center gap-1.5 shadow-sm">
                <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                <span>הצג תשובה ופתרון</span>
              </button>
            </div>
          </div>

          <!-- Main Content: Graph on one side, Exact Question text on the other -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
            
            <!-- Graph Visual Container (lg: 6 cols) with integrated Zoom controls -->
            <div class="lg:col-span-6 bg-slate-50 p-4 sm:p-5 rounded-2xl border border-slate-200/80 shadow-inner relative flex flex-col gap-2">
              
              <!-- Graph Toolbar: Zoom & Fullscreen -->
              <div class="no-print flex items-center justify-between pb-1 text-xs">
                <div class="flex items-center gap-1.5 bg-white px-2 py-1 rounded-xl border border-slate-200 shadow-sm">
                  <span class="text-[11px] font-bold text-slate-500">זום גרף:</span>
                  <button onclick="zoomCardGraph(${q.id}, -0.2)" title="הקטן גרף" class="w-6 h-6 flex items-center justify-center text-slate-700 hover:bg-slate-100 rounded font-bold">-</button>
                  <span id="zoom-label-${q.id}" class="text-[11px] font-semibold text-slate-700 px-1">${Math.round(currentScale * 100)}%</span>
                  <button onclick="zoomCardGraph(${q.id}, 0.2)" title="הגדל גרף" class="w-6 h-6 flex items-center justify-center text-slate-700 hover:bg-slate-100 rounded font-bold">+</button>
                  <button onclick="resetCardGraphZoom(${q.id})" title="אפס זום" class="text-[10px] text-indigo-600 hover:underline px-1">איפוס</button>
                </div>

                <button onclick="openGraphModal(${q.id})" title="הצג גרף ענק בחלון נפרד להקרנה" class="flex items-center gap-1 px-2.5 py-1 rounded-xl bg-white border border-slate-200 text-slate-700 hover:text-indigo-700 hover:border-indigo-200 font-bold transition shadow-sm">
                  <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                  <span class="text-[11px]">הגדל להקרנה</span>
                </button>
              </div>

              <!-- Stable Aspect-Ratio Frame (Never collapses or distorts) -->
              <div class="graph-aspect-container" id="graph-frame-${q.id}">
                <div id="graph-scaler-${q.id}" class="w-full h-full flex items-center justify-center transition-transform duration-200" style="transform: scale(${currentScale}); transform-origin: center center;">
                  ${renderGraphSVG(q.graphType, q.id)}
                </div>
              </div>

              <div class="flex items-center justify-between text-[11px] text-slate-400 px-1">
                <span>יחס מימדים וקטורי מוגן</span>
                <span class="text-indigo-600 font-medium">ריחוף בעכבר לקריאת נקודות</span>
              </div>
            </div>

            <!-- Question Text Body (Exact wording from document) (lg: 6 cols) -->
            <div class="lg:col-span-6 flex flex-col justify-between h-full">
              <div class="${s.base} ${s.line}">
                ${formatQuestionText(q.text)}
              </div>
            </div>

          </div>

          <!-- Solution / Answer Drawer -->
          <div id="solution-${q.id}" class="hidden mt-6 pt-5 border-t-2 border-dashed border-indigo-100 transition-all">
            <div class="p-4 sm:p-5 rounded-2xl bg-indigo-50/60 border border-indigo-100 text-slate-800">
              <div class="flex items-center gap-2 mb-2 font-black text-indigo-900 text-sm sm:text-base">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>תשובות ופתרון מלא מתוך הקובץ:</span>
              </div>
              <div class="text-sm sm:text-base whitespace-pre-line leading-relaxed font-medium text-slate-700">
                ${q.answers}
              </div>
            </div>
          </div>

        </div>
      `;
    }
  </script>

  <script>
    // Initialize Jump Selector
    function populateJumpSelect() {
      const select = document.getElementById('question-jump-select');
      select.innerHTML = '';
      questionsData.forEach((q, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${idx + 1}. שאלה ${q.sourceNum} - ${q.title}`;
        select.appendChild(opt);
      });
    }

    // Render Current View
    function renderApp() {
      if (currentViewMode === 'single') {
        document.getElementById('single-view-container').classList.remove('hidden');
        document.getElementById('all-view-container').classList.add('hidden');
        
        const q = questionsData[currentIndex];
        document.getElementById('current-question-card').innerHTML = createQuestionCardHTML(q, true);
        document.getElementById('question-jump-select').value = currentIndex;
        document.getElementById('question-total-count').textContent = `מתוך ${questionsData.length}`;
      } else {
        document.getElementById('single-view-container').classList.add('hidden');
        document.getElementById('all-view-container').classList.remove('hidden');
        
        const filtered = currentCategory === 'all' 
          ? questionsData 
          : questionsData.filter(q => q.category === currentCategory);

        const container = document.getElementById('all-view-container');
        container.innerHTML = filtered.map(q => createQuestionCardHTML(q, false)).join('');
      }

      attachTooltips();
      attachSvgCrosshairTracker();
    }

    // Graph Card Zoom Handlers
    function zoomCardGraph(qId, delta) {
      const current = cardGraphScales[qId] || 1;
      const newScale = Math.min(2.0, Math.max(0.8, Math.round((current + delta) * 10) / 10));
      cardGraphScales[qId] = newScale;
      
      const scaler = document.getElementById(`graph-scaler-${qId}`);
      if (scaler) {
        scaler.style.transform = `scale(${newScale})`;
      }
      const label = document.getElementById(`zoom-label-${qId}`);
      if (label) {
        label.textContent = `${Math.round(newScale * 100)}%`;
      }
    }

    function resetCardGraphZoom(qId) {
      cardGraphScales[qId] = 1;
      const scaler = document.getElementById(`graph-scaler-${qId}`);
      if (scaler) {
        scaler.style.transform = `scale(1)`;
      }
      const label = document.getElementById(`zoom-label-${qId}`);
      if (label) {
        label.textContent = `100%`;
      }
    }

    // Enlarged Graph Modal Controller
    function openGraphModal(qId) {
      const q = questionsData.find(item => item.id === qId);
      if (!q) return;

      document.getElementById('modal-title').textContent = `שאלה ${q.sourceNum} - ${q.title}`;
      document.getElementById('modal-category-badge').textContent = q.categoryName;
      document.getElementById('modal-graph-container').innerHTML = renderGraphSVG(q.graphType, `modal-${q.id}`);
      
      document.getElementById('graph-modal').classList.remove('hidden');
      attachTooltips();
      attachSvgCrosshairTracker();
    }

    function closeGraphModal(e) {
      if (e && e.target && e.target.closest('#modal-graph-container')) return;
      document.getElementById('graph-modal').classList.add('hidden');
      document.getElementById('modal-graph-container').innerHTML = '';
    }

    // Toggle Answer Drawer
    function toggleAnswer(qId) {
      const el = document.getElementById(`solution-${qId}`);
      const btn = document.getElementById(`btn-ans-${qId}`);
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
        btn.classList.remove('bg-slate-50', 'text-slate-700');
        btn.querySelector('span').textContent = 'הסתר תשובה';
      } else {
        el.classList.add('hidden');
        btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
        btn.classList.add('bg-slate-50', 'text-slate-700');
        btn.querySelector('span').textContent = 'הצג תשובה ופתרון';
      }
    }

    // Navigation Between Questions
    function navigateQuestion(delta) {
      currentIndex += delta;
      if (currentIndex < 0) currentIndex = questionsData.length - 1;
      if (currentIndex >= questionsData.length) currentIndex = 0;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpToQuestion(idx) {
      currentIndex = idx;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // View Mode Toggle
    function setViewMode(mode) {
      currentViewMode = mode;
      const btnSingle = document.getElementById('btn-mode-single');
      const btnAll = document.getElementById('btn-mode-all');

      if (mode === 'single') {
        btnSingle.className = 'px-3 py-1.5 rounded-lg text-sm font-bold transition-all bg-white text-indigo-700 shadow-sm flex items-center gap-1.5';
        btnAll.className = 'px-3 py-1.5 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5';
      } else {
        btnAll.className = 'px-3 py-1.5 rounded-lg text-sm font-bold transition-all bg-white text-indigo-700 shadow-sm flex items-center gap-1.5';
        btnSingle.className = 'px-3 py-1.5 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1.5';
      }
      renderApp();
    }

    // Category Filter
    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(pill => {
        pill.classList.remove('bg-indigo-600', 'text-white', 'font-bold');
        pill.classList.add('bg-slate-100', 'text-slate-600');
      });
      event.target.classList.add('bg-indigo-600', 'text-white', 'font-bold');
      event.target.classList.remove('bg-slate-100', 'text-slate-600');

      if (cat !== 'all') {
        const firstIdx = questionsData.findIndex(q => q.category === cat);
        if (firstIdx !== -1) {
          currentIndex = firstIdx;
        }
      }
      renderApp();
    }

    // Font size adjuster
    function changeFontSize(dir) {
      fontSizeDelta = Math.max(-1, Math.min(2, fontSizeDelta + dir));
      const labels = { '-1': 'קטן', '0': 'רגיל', '1': 'גדול', '2': 'ענק' };
      document.getElementById('font-size-label').textContent = labels[fontSizeDelta.toString()];
      renderApp();
    }

    // Toggle Ocean Question Connecting Lines (Question 9)
    function toggleOceanSegments() {
      connectSegmentsOcean = !connectSegmentsOcean;
      renderApp();
    }

    // Guidelines & Crosshair toggle button
    function toggleCrosshair() {
      crosshairEnabled = !crosshairEnabled;
      const btn = document.getElementById('btn-toggle-crosshair');
      if (crosshairEnabled) {
        btn.classList.add('bg-indigo-600', 'text-white');
        btn.classList.remove('bg-white', 'text-slate-700');
      } else {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('bg-white', 'text-slate-700');
        // Hide guides on all SVGs
        document.querySelectorAll('.crosshair-guide-layer').forEach(layer => {
          layer.classList.add('opacity-0');
        });
      }
    }

    // SVG Crosshair dynamic tracker
    function attachSvgCrosshairTracker() {
      document.querySelectorAll('.graph-svg-root').forEach(svg => {
        const guideLayer = svg.querySelector('.crosshair-guide-layer');
        if (!guideLayer) return;

        const lineH = guideLayer.querySelector('.ch-line-h');
        const lineV = guideLayer.querySelector('.ch-line-v');
        const bubbleGroup = guideLayer.querySelector('.ch-bubble-group');
        const bubbleBg = guideLayer.querySelector('.ch-bubble-bg');
        const bubbleText = guideLayer.querySelector('.ch-bubble-text');

        svg.addEventListener('mousemove', (e) => {
          if (!crosshairEnabled) {
            guideLayer.classList.add('opacity-0');
            return;
          }

          // Convert client mouse coordinates directly into SVG viewBox coordinates
          const pt = svg.createSVGPoint();
          pt.x = e.clientX;
          pt.y = e.clientY;
          const ctm = svg.getScreenCTM();
          if (!ctm) return;
          const svgP = pt.matrixTransform(ctm.inverse());

          // Constrain within plot zone
          if (svgP.x < 60 || svgP.x > 440 || svgP.y < 35 || svgP.y > 330) {
            guideLayer.classList.add('opacity-0');
            return;
          }

          guideLayer.classList.remove('opacity-0');
          lineH.setAttribute('x1', '60');
          lineH.setAttribute('x2', '440');
          lineH.setAttribute('y1', svgP.y);
          lineH.setAttribute('y2', svgP.y);

          lineV.setAttribute('y1', '35');
          lineV.setAttribute('y2', '330');
          lineV.setAttribute('x1', svgP.x);
          lineV.setAttribute('x2', svgP.x);

          // Update coordinate badge
          const coordText = `X: ${Math.round(svgP.x)} | Y: ${Math.round(svgP.y)}`;
          bubbleText.textContent = coordText;
          const textW = Math.max(75, bubbleText.getComputedTextLength ? bubbleText.getComputedTextLength() + 14 : 75);
          bubbleBg.setAttribute('width', textW);
          bubbleBg.setAttribute('height', '20');

          // Position bubble slightly offset from cursor
          let bx = svgP.x + 8;
          let by = svgP.y - 25;
          if (bx + textW > 450) bx = svgP.x - textW - 8;
          if (by < 40) by = svgP.y + 10;

          bubbleBg.setAttribute('x', bx);
          bubbleBg.setAttribute('y', by);
          bubbleText.setAttribute('x', bx + textW / 2);
          bubbleText.setAttribute('y', by + 10);
        });

        svg.addEventListener('mouseleave', () => {
          guideLayer.classList.add('opacity-0');
        });
      });
    }

    // Tooltip and interactive points handler
    function attachTooltips() {
      document.querySelectorAll('.graph-point').forEach(pt => {
        pt.addEventListener('mouseenter', (e) => {
          const tipText = pt.getAttribute('data-tip');
          if (!tipText) return;
          showTooltip(e, tipText);
        });
        pt.addEventListener('mouseleave', hideTooltip);
      });
    }

    let tooltipEl = null;
    function showTooltip(e, text) {
      hideTooltip();
      tooltipEl = document.createElement('div');
      tooltipEl.className = 'fixed z-50 px-2.5 py-1 bg-slate-900/90 text-white text-xs font-bold rounded-lg pointer-events-none shadow-lg transform -translate-x-1/2 -translate-y-full mb-2';
      tooltipEl.textContent = text;
      document.body.appendChild(tooltipEl);
      const rect = e.target.getBoundingClientRect();
      tooltipEl.style.left = `${rect.left + rect.width / 2}px`;
      tooltipEl.style.top = `${rect.top - 6}px`;
    }

    function hideTooltip() {
      if (tooltipEl) {
        tooltipEl.remove();
        tooltipEl = null;
      }
    }

    // Fullscreen toggle
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard Shortcuts (Arrow keys, 'T', 'Escape')
    window.addEventListener('keydown', (e) => {
      if (['input', 'textarea', 'select'].includes(document.activeElement.tagName.toLowerCase())) return;

      if (e.key === 'Escape') {
        closeGraphModal();
      } else if (e.key === 'ArrowLeft') {
        navigateQuestion(1);
      } else if (e.key === 'ArrowRight') {
        navigateQuestion(-1);
      } else if (e.key.toLowerCase() === 't') {
        const q = questionsData[currentIndex];
        toggleAnswer(q.id);
      }
    });

    // Boot
    window.onload = function() {
      populateJumpSelect();
      renderApp();
    };
  </script>
</body>
</html>
