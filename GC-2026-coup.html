<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coup Cheat Sheet - A4 Print</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap');
        
        :root {
            --c-header: #333333;
            --c-duke: #8B5CF6; /* סגול */
            --c-assassin: #333333;
            --c-contessa: #8B4513; /* חום */
            --c-captain: #67A7C7;
            --c-ambassador: #97B727;
            --c-border: #d1d5db;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: #e5e7eb;
            color: #1f2937;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            letter-spacing: 0.3px;
        }

        /* הגדרת דף A4 לרוחב */
        .a4-page {
            width: 297mm;
            height: 210mm;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: repeat(2, 140mm);
            grid-template-rows: repeat(2, 100mm);
            justify-content: center;
            align-content: center;
            gap: 4mm;
            box-sizing: border-box;
            position: relative;
        }

        /* הגדרת כרטיסיה לרוחב */
        .card {
            width: 140mm;
            height: 100mm;
            border: 1px dashed #9ca3af;
            box-sizing: border-box;
            padding: 3mm 5mm; /* ריווח קטן יותר כדי למנוע גלישה */
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden; /* מונע גלישה ויזואלית החוצה */
        }

        .coup-table {
            border: 1px solid var(--c-border);
            width: 100%;
            border-collapse: collapse;
            font-size: 10.5px; /* פונט מעט קטן יותר לטבלה */
            margin-bottom: 3px;
            table-layout: fixed; /* שומר על רוחב העמודות בדיוק לפי האחוזים */
        }
        
        .coup-table th {
            background-color: var(--c-header);
            color: white;
            font-weight: 500;
            padding: 3px; /* ריווח פנימי מוקטן */
            border: 1px solid var(--c-border);
            text-align: right;
            line-height: 1.1;
        }

        .coup-table td {
            border: 1px solid var(--c-border);
            padding: 2px 4px; /* הקטנו מעט את הגובה הפנימי כדי לפנות מקום לתיבה למטה */
            vertical-align: middle;
            line-height: 1.1;
            word-wrap: break-word; /* מונע גלישת מילים מחוץ לתא */
        }

        .coup-table tbody tr:nth-child(even) td:not(.char-cell) {
            background-color: #f9fafb;
        }

        .char-cell {
            color: white;
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.5px;
        }
        
        .bg-duke { background-color: var(--c-duke); }
        .bg-assassin { background-color: var(--c-assassin); }
        .bg-contessa { background-color: var(--c-contessa); }
        .bg-captain { background-color: var(--c-captain); }
        .bg-ambassador { background-color: var(--c-ambassador); }
        
        .bg-mixed {
            background: linear-gradient(135deg, var(--c-captain) 50%, var(--c-ambassador) 50%);
            color: white;
            font-weight: 500;
            text-align: center;
        }

        .char-badge {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 3px;
            color: white;
            font-weight: 500;
            font-size: 10px;
            margin: 1px;
            letter-spacing: 0.3px;
        }

        .unblockable {
            text-align: center;
            line-height: 1.1;
        }
        .unblockable-x {
            color: #ef4444;
            font-size: 13px;
            font-weight: bold;
        }
        .unblockable-text {
            color: #dc2626;
            font-size: 9px;
            font-weight: 600;
            display: block;
        }

        .rule-box {
            margin-top: auto;
            border: 1px solid var(--c-border);
            border-radius: 4px;
            display: flex;
            background-color: #fef2f2;
            border-right: 4px solid #ef4444;
            overflow: hidden;
            font-size: 10.5px; 
            font-weight: 500;
            margin-bottom: 0px;
            flex-shrink: 0; /* פקודה חשובה: מונעת מהתיבה להתכווץ ולהיחתך אם חסר מקום */
        }
        .rule-icon {
            padding: 2px 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
        }
        .rule-text {
            padding: 2px 5px;
            flex: 1;
            display: flex;
            align-items: center;
        }

        @media print {
            @page {
                size: A4 landscape; /* הדפסה לרוחב! */
                margin: 0;
            }
            body {
                background-color: white !important;
                padding: 0 !important;
                margin: 0 !important;
                gap: 0;
            }
            .a4-page {
                box-shadow: none;
                page-break-after: always;
                page-break-inside: avoid;
            }
            .no-print {
                display: none !important;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>

    <div class="no-print bg-yellow-100 border border-yellow-400 text-yellow-800 px-4 py-3 rounded text-sm text-center font-bold max-w-2xl">
        🖨️ הוראות הדפסה לכרטיסיות רוחביות:<br>
        1. לחצי Ctrl+P.<br>
        2. בחרי פריסה: <strong>לרוחב (Landscape)</strong>.<br>
        3. בחרי הדפסה <strong>דו-צדדית (Flip on short edge / היפוך לרוחב) - קריטי!</strong>.<br>
        4. הגדרות קנה מידה (Scale) ל-<strong>100% או Actual Size</strong>.<br>
        5. סמני הדפסת צבעי רקע (Background graphics).
    </div>

    <!-- דף 1: קדימה (לפי דמות) -->
    <div class="a4-page" id="page-1"></div>

    <!-- דף 2: אחורה (לפי פעולה) -->
    <div class="a4-page" id="page-2"></div>

                    <tr>

                    <tr>

                    </tr>
                    
                    <tr>
                        <td class="text-center font-semibold text-[13px] text-gray-800">A</td>

                        <td class="empty-cell text-center text-gray-400 text-xs">❌</td>

                    <tr>

                    <tr>

                    <tr>
                        <td class="text-center font-semibold text-[13px] text-green-700">10</td>

                        <td class="unblockable"><span class="unblockable-x">❌</span><span class="unblockable-text">אי אפשר לחסום!</span></td>
                    </tr>
                </tbody>
            </table>
    
            <div class="rule-box">
                <div class="rule-icon">⚠️</div>
                <div class="rule-text"><strong>חוק ברזל:</strong> הגעת ל-10 מטבעות? את חייבת לבצע הפיכה בתורך!</div>
            </div>
        </div>
    </template>

    <template id="template-back">
        <div class="card">
            <!-- כותרת מפוצלת -->
            <div class="flex items-center justify-between mb-1.5 pb-1 border-b border-gray-300 shrink-0">
                <img src="https://cdn-media.web-view.net/i/zxwxdxdscsps/__________________51.png?cache=1718281345891" alt="אורנים קמה" class="h-6 object-contain">
                <div class="text-left flex flex-col justify-center">
                    <span class="text-[9px] text-gray-500 font-medium leading-none mb-0.5">מזכרת מ-</span>
                    <strong class="text-[#1f2937] text-[13px] font-bold uppercase tracking-wider leading-none">Game Changer 2026</strong>
                </div>
            </div>

            <!-- הכנת המשחק בשורה אחת -->

                Coup — פירוט לפי סוג פעולה
            </div>

                <thead>
                    <tr>

                </thead>

                    <tr>

                    </tr>

            <div class="rule-box">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const page1 = document.getElementById('page-1');
            const page2 = document.getElementById('page-2');
            const templateFront = document.getElementById('template-front').content;
            const templateBack = document.getElementById('template-back').content;

            // יצירת 4 כרטיסיות בכל דף במקום 6 בגלל המעבר ל-Landscape
            for (let i = 0; i < 4; i++) {
                page1.appendChild(document.importNode(templateFront, true));
                page2.appendChild(document.importNode(templateBack, true));
            }
        });
    </script>
</body>
</html>
